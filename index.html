"use strict";

window.addEventListener('error', (e)=>{
  try {
    const c=document.getElementById('game'), x=c.getContext('2d');
    x.fillStyle='#000'; x.fillRect(0,0,320,240);
    x.fillStyle='#f44'; x.font='10px monospace'; x.textBaseline='top';
    x.fillText('ERROR:', 8, 8);
    const msg=(e.message||String(e.error||'')).substring(0,400);
    let line='',y=22; for (const w of msg.split(' ')){
      if((line+' '+w).length>38){x.fillText(line,8,y);y+=12;line=w;} else line=(line+' '+w).trim();
    }
    if(line) x.fillText(line,8,y);
    if(e.lineno) x.fillText('line '+e.lineno,8,y+14);
  } catch(_){}
});

// JOURNEY TO THE CENTER OF HAWKTHORNE

// Everything (art, music, levels, story) lives in this one file.

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W=320, H=240, TS=16, DT=1/60;
function fit(){
  const s = Math.max(1, Math.min(Math.floor(window.innerWidth/W), Math.floor((window.innerHeight-40)/H)));
  canvas.style.width=(W*s)+'px'; canvas.style.height=(H*s)+'px';
}
window.addEventListener('resize', fit); fit();

function mkCanvas(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
  return [c,g];
}
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
function hash2(x,y){
  let h=(x*374761393 + y*668265263)|0;
  h=Math.imul(h^(h>>>13),1274126177);
  return ((h^(h>>>16))>>>0)/4294967295;
}
function rectOverlap(ax,ay,aw,ah,bx,by,bw,bh){ return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by; }
function boxOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

// ============================================================================
// SPRITES — ASCII art, baked once into canvases (normal, mirrored, white flash)
// ============================================================================
function S(legend, art){
  const rows = art.replace(/^\n+|\s+$/g,'').split('\n').map(r=>r.replace(/^\s+/,''));
  return { legend, rows, w:Math.max(...rows.map(r=>r.length)), h:rows.length, cv:null };
}
function bakeSprite(spr){
  const [c,g]=mkCanvas(spr.w,spr.h);
  for (let ry=0; ry<spr.rows.length; ry++){
    const r=spr.rows[ry];
    for (let rx=0; rx<r.length; rx++){
      const ch=r[rx];
      if (ch==='.'||ch===' ') continue;
      g.fillStyle = P[spr.legend[ch]] || spr.legend[ch] || ch;
      g.fillRect(rx,ry,1,1);
    }
  }
  const [f,fg]=mkCanvas(spr.w,spr.h); fg.translate(spr.w,0); fg.scale(-1,1); fg.drawImage(c,0,0);
  const [wh,wg]=mkCanvas(spr.w,spr.h); wg.drawImage(c,0,0); wg.globalCompositeOperation='source-in'; wg.fillStyle='#fff'; wg.fillRect(0,0,spr.w,spr.h);
  const [whf,wfg]=mkCanvas(spr.w,spr.h); wfg.drawImage(f,0,0); wfg.globalCompositeOperation='source-in'; wfg.fillStyle='#fff'; wfg.fillRect(0,0,spr.w,spr.h);
  spr.cv=c; spr.cvf=f; spr.wh=wh; spr.whf=whf;
}
function drawSprite(spr, x, y, flip=false, alpha=1, flash=false, scale=1){
  if (!spr) return;
  if (!spr.cv) bakeSprite(spr);
  const img = flash ? (flip?spr.whf:spr.wh) : (flip?spr.cvf:spr.cv);
  if (alpha!==1) ctx.globalAlpha=alpha;
  if (scale===1) ctx.drawImage(img, Math.round(x), Math.round(y));
  else ctx.drawImage(img, Math.round(x), Math.round(y), spr.w*scale, spr.h*scale);
  if (alpha!==1) ctx.globalAlpha=1;
}

// ============================================================================
const FONT_DATA="00000004444404aa00000aavavaa4fke5u4op248j3cik8lid44800002488842842224804lel40044v4400000c48000e00000000cc01248g0ehjlphe4c4444eeh1248vv2421he26aiv22vgu11he68guhhev124888ehhehheehhf12c0cc0cc00cc0c48248g84200v0v008421248eh12404eh1dlleehhhvhhuhhuhhuehggghesihhhisvgguggvvggugggehgnhhfhhhvhhhe44444e72222ichikokihggggggvhrllhhhhhpljhhehhhhheuhhugggehhhliduhhukihfgge11uv444444hhhhhhehhhhha4hhhlllahha4ahhhhha444v1248gve88888e0g84210e22222e4ah0000000000v842000000e1fhfggmphhu00egghe11djhhf00ehvge698s88800fhf1eggmphhh40c444e20622icggikokic44444e00qllhh00mphhh00ehhhe00uhugg00djf1100mpggg00ege1u88s889600hhhjd00hhha400hhlla00ha4ah00hhf1e00v248v244844244444448442448008l20000ve400gosusog137f731048v840042v2404el44400444le400cc0000avve40guvuggg44veah0";
const FONT_EXTRA="▼▶◀←→↑↓•♥⚑★";
const FONT_N = 95 + FONT_EXTRA.length;
const FONT_MAP = { '—':'-', '–':'-', '’':"'", '‘':"'", '“':'"', '”':'"', '…':'...', '✓':'★' };
function normText(s){ let o=''; for (const ch of String(s)) o += FONT_MAP[ch]!==undefined ? FONT_MAP[ch] : ch; return o; }
function glyphIndex(ch){
  const c=ch.charCodeAt(0);
  if (c>=32 && c<127) return c-32;
  const e=FONT_EXTRA.indexOf(ch);
  return e>=0 ? 95+e : 31; // '?'
}
const fontAtlases = {};
function fontAtlas(color){
  let a=fontAtlases[color];
  if (a) return a;
  const [c,g]=mkCanvas(FONT_N*6,7);
  g.fillStyle=color;
  for (let i=0;i<FONT_N;i++){
    for (let r=0;r<7;r++){
      const v=parseInt(FONT_DATA[i*7+r],32);
      for (let b=0;b<5;b++) if (v & (1<<(4-b))) g.fillRect(i*6+b,r,1,1);
    }
  }
  fontAtlases[color]=c;
  return c;
}
function textWidth(s, scale=1){ const n=[...normText(s)].length; return n? (n*6-1)*scale : 0; }
function txt(s, x, y, color='#fff', shadow=true, scale=1){
  s=normText(s);
  x=Math.round(x); y=Math.round(y);
  if (shadow){
    const sa=fontAtlas('#000');
    let cx=x;
    for (const ch of s){ const gi=glyphIndex(ch); ctx.drawImage(sa, gi*6,0,5,7, cx+scale, y+scale, 5*scale, 7*scale); cx+=6*scale; }
  }
  const a=fontAtlas(color);
  let cx=x;
  for (const ch of s){ const gi=glyphIndex(ch); ctx.drawImage(a, gi*6,0,5,7, cx, y, 5*scale, 7*scale); cx+=6*scale; }
}
function txtC(s, y, color='#fff', scale=1, cx=W/2, shadow=true){ txt(s, Math.round(cx - textWidth(s,scale)/2), y, color, shadow, scale); }
function txtR(s, x, y, color='#fff', shadow=true){ txt(s, x - textWidth(s), y, color, shadow); }
function wrapText(s, max){
  const out=[];
  for (const para of normText(s).split('\n')){
    let line='';
    for (const w of para.split(' ')){
      if ((line?line+' '+w:w).length>max){ if(line) out.push(line); line=w; }
      else line = line ? line+' '+w : w;
    }
    out.push(line);
  }
  return out;
}
function panel(x,y,w,h,fill='#0b0d18',edge='#fc4'){
  ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=edge;
  ctx.fillRect(x+1,y,w-2,1); ctx.fillRect(x+1,y+h-1,w-2,1);
  ctx.fillRect(x,y+1,1,h-2); ctx.fillRect(x+w-1,y+1,1,h-2);
  ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(x+1,y+1,w-2,1);
}

// ============================================================================
// TILES
//  solid:  # _ dirt   S stone   C cave rock   K castle brick   M metal
//          % crumbling block   < > conveyor belts
//  one-way (jump up through, ↓+SPACE drops): = wood   - ledge/girder   r roof
//  hazard: ^ floor spikes   v ceiling spikes
//  ladder: H
//  background (no collision): W wall  w window  D door  B back-wall  | pillar
//          c cave wall  P pipe  F fence  f flowers  m mushroom  * gems  t torch  n banner
//  $ secret: looks solid, but is empty — the cover fades when you step inside
// ============================================================================
const TILEDEF = {
  '#':{s:1,k:'dirt'}, '_':{s:1,k:'dirt'}, 'S':{s:1,k:'stone'}, 'C':{s:1,k:'rock'}, 'K':{s:1,k:'brick'}, 'M':{s:1,k:'metal'},
  '%':{s:1,crumble:1,dyn:1}, '<':{s:1,conv:-1,dyn:1}, '>':{s:1,conv:1,dyn:1},
  '=':{o:1,k:'plank'}, '-':{o:1,k:'ledge'}, 'r':{o:1,k:'roof'},
  '^':{z:1,k:'spikeU'}, 'v':{z:1,k:'spikeD'},
  'H':{ladder:1,k:'ladder'},
  'W':{bg:1,k:'wall'}, 'w':{bg:1,k:'window'}, 'D':{bg:1,k:'door'}, 'B':{bg:1,k:'bgbrick'}, '|':{bg:1,k:'pillar'},
  'c':{bg:1,k:'bgrock'}, 'P':{bg:1,k:'pipe'}, 'F':{bg:1,k:'fence'}, 'f':{bg:1,k:'flowers'},
  'm':{bg:1,k:'mushroom',light:30}, '*':{bg:1,k:'gem',light:34}, 't':{bg:1,k:'torch',light:50}, 'n':{bg:1,k:'banner'},
  '$':{fake:1},
};
const HOUSE_T = {W:1,w:1,D:1};
const BACKWALL_T = {B:1,'|':1,t:1,n:1,P:1};

let paintLvl=null;
function pch(tx,ty){
  const L=paintLvl;
  if (tx<0||tx>=L.w) return '#';
  if (ty<0) return ' ';
  if (ty>=L.h) return L.grid[L.h-1][tx];
  return L.grid[ty][tx];
}
function vsolid(tx,ty){ const c=pch(tx,ty); const d=TILEDEF[c]; return !!(d && (d.s || d.fake)); }
function speck(g,x,y,tx,ty,n,cols,w=2,h=1){
  for (let i=0;i<n;i++){
    const px=(hash2(tx*7+i*3,ty*13+i)*(16-w))|0, py=(hash2(tx*5-i,ty*11+i*7)*(16-h))|0;
    g.fillStyle=cols[i%cols.length]; g.fillRect(x+px,y+py,w,h);
  }
}

const UNDER_T = {B:'bgbrick','|':'bgbrick',t:'bgbrick',n:'bgbrick',P:'bgbrick',W:'wall',w:'wall',D:'wall',c:'bgrock'};
function underlay(g,x,y,tx,ty){
  for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]){
    const c=pch(tx+dx,ty+dy);
    if (UNDER_T[c]){ PAINT[UNDER_T[c]](g,x,y,tx,ty); return; }
    if (c==='$'){ backFill(g,x,y,tx,ty); return; }
  }
}
const PAINT = {
  dirt(g,x,y,tx,ty){
    const above=pch(tx,ty-1), top=!vsolid(tx,ty-1) && above!=='H' && !TILEDEF[above]?.bg, wipes=paintLvl.theme==='wipes';
    g.fillStyle=wipes?'#8a5a30':'#7a4a24'; g.fillRect(x,y,16,16);
    speck(g,x,y,tx,ty,7,wipes?['#6a4020','#a8784a']:['#5c3418','#946038']);
    if (!vsolid(tx-1,ty)){ g.fillStyle='#4a2a12'; g.fillRect(x,y,1,16); }
    if (!vsolid(tx+1,ty)){ g.fillStyle='#4a2a12'; g.fillRect(x+15,y,1,16); }
    if (!vsolid(tx,ty+1)){ g.fillStyle='#3a200c'; g.fillRect(x,y+15,16,1); }
    if (top){
      g.fillStyle=wipes?'#5a9a34':'#3a9a34'; g.fillRect(x,y,16,4);
      g.fillStyle=wipes?'#9ad048':'#6cd048'; g.fillRect(x,y,16,1);
      g.fillStyle=wipes?'#3a7a24':'#2a7a28';
      for (let i=0;i<16;i++){ const r=hash2(tx*16+i,ty); if (r<0.45) g.fillRect(x+i,y+4,1,r<0.2?2:1); }
      if (!vsolid(tx-1,ty)) g.fillRect(x,y+4,1,3);
      if (!vsolid(tx+1,ty)) g.fillRect(x+15,y+4,1,3);
    }
  },
  stone(g,x,y,tx,ty){
    g.fillStyle='#8c8c98'; g.fillRect(x,y,16,16);
    g.fillStyle='#a4a4b0'; g.fillRect(x,y,16,1); g.fillRect(x,y+8,16,1);
    g.fillStyle='#5e5e6a'; g.fillRect(x,y+7,16,1); g.fillRect(x,y+15,16,1);
    const o=(tx+ty)%2?4:12; g.fillRect(x+o,y,1,7); g.fillRect(x+(o+8)%16,y+8,1,7);
    speck(g,x,y,tx,ty,3,['#7a7a86'],2,1);
    if (!vsolid(tx,ty-1)){ g.fillStyle='#d0d0dc'; g.fillRect(x,y,16,1); }
    if (!vsolid(tx,ty+1)){ g.fillStyle='#44444e'; g.fillRect(x,y+15,16,1); }
    if (!vsolid(tx-1,ty)){ g.fillStyle='#b0b0bc'; g.fillRect(x,y,1,16); }
    if (!vsolid(tx+1,ty)){ g.fillStyle='#50505a'; g.fillRect(x+15,y,1,16); }
  },
  rock(g,x,y,tx,ty){
    g.fillStyle='#3b2b2b'; g.fillRect(x,y,16,16);
    speck(g,x,y,tx,ty,5,['#4a3634','#2a1c1c','#4e3a36'],3,2);
    if (!vsolid(tx,ty-1)){ g.fillStyle='#7a6256'; g.fillRect(x,y,16,1); g.fillStyle='#5a463e'; g.fillRect(x,y+1,16,2);
      g.fillStyle='#3b2b2b'; for (let i=0;i<16;i+=3) if (hash2(tx*9+i,ty)<0.5) g.fillRect(x+i,y+2,2,1); }
    if (!vsolid(tx,ty+1)){ g.fillStyle='#1c1212'; g.fillRect(x,y+14,16,2);
      g.fillStyle='#2a1c1c'; for (let i=0;i<16;i+=4) if (hash2(tx+i,ty*3)<0.5) g.fillRect(x+i,y+13,2,1); }
    if (!vsolid(tx-1,ty)){ g.fillStyle='#54403a'; g.fillRect(x,y,1,16); }
    if (!vsolid(tx+1,ty)){ g.fillStyle='#231818'; g.fillRect(x+15,y,1,16); }
  },
  brick(g,x,y,tx,ty){
    g.fillStyle='#5b4a78'; g.fillRect(x,y,16,16);
    for (let r=0;r<4;r++){
      g.fillStyle='#6e5c90'; g.fillRect(x,y+r*4,16,1);
      g.fillStyle='#2e2442'; g.fillRect(x,y+r*4+3,16,1);
      const off=((r+ty*4)%2)?0:4;
      g.fillRect(x+off,y+r*4,1,3); g.fillRect(x+off+8,y+r*4,1,3);
    }
    if (!vsolid(tx,ty-1)){ g.fillStyle='#a896cc'; g.fillRect(x,y,16,1); }
    if (!vsolid(tx,ty+1)){ g.fillStyle='#1a1428'; g.fillRect(x,y+15,16,1); }
    if (!vsolid(tx-1,ty)){ g.fillStyle='#7e6ca6'; g.fillRect(x,y,1,16); }
    if (!vsolid(tx+1,ty)){ g.fillStyle='#241c36'; g.fillRect(x+15,y,1,16); }
  },
  metal(g,x,y,tx,ty){
    g.fillStyle='#6c7480'; g.fillRect(x,y,16,16);
    g.fillStyle='#8a94a0'; g.fillRect(x+1,y+1,14,1); g.fillRect(x+1,y+1,1,14);
    g.fillStyle='#4a5260'; g.fillRect(x+1,y+14,14,1); g.fillRect(x+14,y+1,1,14);
    g.fillStyle='#3a4048'; g.fillRect(x,y,16,1); g.fillRect(x,y,1,16);

function backFill(g,x,y,tx,ty){
  const th=paintLvl.theme;
  if (th==='cave') PAINT.bgrock(g,x,y,tx,ty);
  else if (th==='castle'||th==='throne') PAINT.bgbrick(g,x,y,tx,ty);
  else PAINT.bgdirt(g,x,y,tx,ty);
}
// Bake a whole level's static tile layer, plus a cover layer for each secret room.
function bakeLevel(L){
  paintLvl=L;
  const [c,g]=mkCanvas(L.w*TS, L.h*TS);
  for (let ty=0;ty<L.h;ty++) for (let tx=0;tx<L.w;tx++){
    const ch=L.grid[ty][tx], d=TILEDEF[ch];
    if (!d) continue;
    if (d.dyn){ underlay(g, tx*TS, ty*TS, tx, ty); continue; }
    if (d.fake){ backFill(g, tx*TS, ty*TS, tx, ty); continue; }
    PAINT[d.k](g, tx*TS, ty*TS, tx, ty);
  }
  L.bake=c;
  // secret regions
  L.secrets=[];
  const seen=new Set();
  for (let ty=0;ty<L.h;ty++) for (let tx=0;tx<L.w;tx++){
    if (L.grid[ty][tx]!=='$' || seen.has(ty*L.w+tx)) continue;
    const cells=[], stack=[[tx,ty]]; seen.add(ty*L.w+tx);
    let x0=tx,x1=tx,y0=ty,y1=ty;
    while (stack.length){
      const [cx,cy]=stack.pop(); cells.push([cx,cy]);
      x0=Math.min(x0,cx); x1=Math.max(x1,cx); y0=Math.min(y0,cy); y1=Math.max(y1,cy);
      for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cx+dx, ny=cy+dy;
        if (nx<0||ny<0||nx>=L.w||ny>=L.h) continue;
        if (L.grid[ny][nx]==='$' && !seen.has(ny*L.w+nx)){ seen.add(ny*L.w+nx); stack.push([nx,ny]); }
      }
    }
    const [sc,sg]=mkCanvas((x1-x0+1)*TS,(y1-y0+1)*TS);
    const painter = PAINT[TILEDEF[L.fake||'#'].k];
    for (const [cx,cy] of cells) painter(sg,(cx-x0)*TS,(cy-y0)*TS,cx,cy);
    L.secrets.push({x:x0*TS,y:y0*TS,w:(x1-x0+1)*TS,h:(y1-y0+1)*TS,cv:sc,cells:new Set(cells.map(([a,b])=>b*L.w+a)),alpha:1,open:false});
  }
  paintLvl=null;
}

// ---- choice handlers
function elderAnswer(ok){
  if (ok){ game.s.gold+=10; setF('elderDone'); sfx('buy'); say('elder_right'); }
  else { sfx('nope'); say('elder_wrong'); }
}
function guardianAnswer(q, ok){
  if (!ok){ sfx('nope'); say('guardian_wrong'); return; }
  if (q===1){ sfx('cursor'); say('guardian_q2'); }
  else { setF('guardianDone'); game.s.scrolls++; sfx('crystal'); say('guardian_right'); }
}
function smithyChoice(returned){
  setF('smithyScene');
  if (returned){ setF('smithyReturned'); game.s.maxhp+=2; game.s.hp=game.s.maxhp; sfx('crystal'); say('smithy_return'); }
  else { setF('smithyLooted'); game.s.gold+=15; sfx('coin'); say('smithy_keep'); }
}
function gilbertChoice(help){
  if (help){ setF('helpedGilbert'); setF('leftGilbert',false); game.s.gold+=5; sfx('item');
    const g=game.ents.find(e=>e.talk==='gilbert_pinned');
    if (g){ g.freed=true; spawnParts(g.x+8,g.y+4,['#888','#555'],14,120); game.shake=6; }
    say('gilbert_helped', ()=>{ if (g) g.runOff=true; });
  } else { setF('leftGilbert'); say('gilbert_left'); }
}

    if (!F('metBritta')){

      if (game.s.violence===0){ game.s.scrolls++; say('britta_pacifist', ()=>openShop('britta')); }
      else say('britta_objects', ()=>openShop('britta'));
    } else say('britta_after', ()=>openShop('britta'));
  },

    if (!F('pierceGold')){ setF('pierceGold'); game.s.gold+=6; sfx('coin'); say('pierce_intro'); }

  hilda(e){
    if (!F('metHilda')) say('hilda_intro');
    else if (F('smithyReturned')) say('hilda_thanks');
    else if (has('lantern')) say('hilda_lantern');
    else say('hilda_remind');

let AC=null, master=null, musicBus=null, sfxBus=null, noiseBuf=null;
let muted = (()=>{ try { return localStorage.getItem('hawkthorne.muted')==='1'; } catch(_){ return false; } })();
function initAudio(){
  if (AC){ if (AC.state==='suspended') AC.resume(); return; }
  try {
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=muted?0:0.55; master.connect(AC.destination);
    musicBus=AC.createGain(); musicBus.gain.value=0.2; musicBus.connect(master);
    sfxBus=AC.createGain(); sfxBus.gain.value=0.34; sfxBus.connect(master);
    const len=AC.sampleRate; noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const a=noiseBuf.getChannelData(0); for (let i=0;i<len;i++) a[i]=Math.random()*2-1;
    songNext = AC.currentTime+0.05;
  } catch(_){ AC=null; }
}
function setMuted(m){
  muted=m; if (master) master.gain.value=muted?0:0.55;
  try { localStorage.setItem('hawkthorne.muted', m?'1':'0'); } catch(_){}
}
function tone(freq, dur, type='square', vol=0.5, when=0, bus=sfxBus, slide=0){
  if (!AC||!bus) return;
  const t=Math.max(AC.currentTime, when||AC.currentTime);
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide), t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.03);
}
function noise(dur, vol=0.3, when=0, bus=sfxBus, hp=0){
  if (!AC||!noiseBuf||!bus) return;
  const t=Math.max(AC.currentTime, when||AC.currentTime);
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let node=s;
  if (hp){ const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; s.connect(f); node=f; }
  node.connect(g); g.connect(bus); s.start(t, Math.random()*0.5); s.stop(t+dur+0.02);
}

const NOTE_I={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function noteFreq(n){
  const m=/^([A-G])(#|b)?(\d)$/.exec(n); if (!m) return 0;
  const midi=12*(+m[3]+1)+NOTE_I[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);
  return 440*Math.pow(2,(midi-69)/12);
}
function parseVoice(str){
  const toks=str.trim().split(/\s+/), out=[];
  for (let i=0;i<toks.length;i++){
    const t=toks[i];
    if (t==='.'||t==='-'){ out.push(null); continue; }
    let len=1; while (toks[i+len]==='-') len++;
    out.push({f:noteFreq(t), tok:t, len});
  }
  return out;
}

function playTrack(name){
  if (songName===name) return;
  songName=name; song=name?SONGS[name]:null; songStep=0;
  if (AC) songNext=AC.currentTime+0.06;
}
function scheduleMusic(){
  if (!AC||!song||muted) { if (AC) songNext=AC.currentTime+0.05; return; }
  const step=60/song.bpm/2;
  if (songNext < AC.currentTime-0.25) songNext=AC.currentTime+0.02;
  while (songNext < AC.currentTime+0.14){
    const v=song.v, t=songNext;
    const L=v.lead[songStep%v.lead.length]; if (L&&L.f) tone(L.f, step*L.len*0.92, song.lw||'square', 0.34, t, musicBus);
    const B=v.bass[songStep%v.bass.length]; if (B&&B.f) tone(B.f, step*B.len*0.95, 'triangle', 0.6, t, musicBus);
    const D=v.drum[songStep%v.drum.length];
    if (D==='k'){ tone(150,0.12,'sine',0.9,t,musicBus,0.3); }
    else if (D==='s'){ noise(0.1,0.35,t,musicBus,1200); }
    else if (D==='h'){ noise(0.03,0.16,t,musicBus,6000); }
    songStep++; songNext+=step;
  }
}

  const a=KEYMAP[e.key];

const PADMAP = [[0,'jump'],[1,'attack'],[2,'attack'],[3,'potion'],[4,'abed'],[5,'potion'],[8,'inv'],[9,'pause'],[12,'up'],[13,'down'],[14,'left'],[15,'right']];
function pollPad(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const now={};
  for (const pad of pads){
    if (!pad) continue;
    for (const [b,a] of PADMAP) if (pad.buttons[b] && pad.buttons[b].pressed) now[a]=true;
    if (pad.axes[0]<-0.45) now.left=true; if (pad.axes[0]>0.45) now.right=true;
    if (pad.axes[1]<-0.6) now.up=true; if (pad.axes[1]>0.6) now.down=true;
  }
  for (const a of ['left','right','up','down','jump','attack','back','pause','confirm','potion','abed','inv']){
    if (now[a] && !padHeld[a]){ pressed[a]=true; initAudio(); }
    padHeld[a]=!!now[a];
  }
}
function syncHeld(){ for (const a of ['left','right','up','down','jump','attack','back','pause','confirm','potion','abed','inv']) held[a]=!!(keyHeld[a]||padHeld[a]); }
function clearPressed(){ for (const k in pressed) pressed[k]=false; }

const GLOBAL_MARKS = {
  '@':{type:'spawn'}, 'o':{type:'coin'}, 'x':{type:'crate'}, '!':{type:'checkpoint'},
  's':{type:'slime'}, 'b':{type:'bat'}, 'g':{type:'goblin'}, 'a':{type:'archer'}, 'k':{type:'knight'},
  'd':{type:'stalactite'}, 'h':{type:'heart'}, 'p':{type:'potion'}, 'u':{type:'towelette'},
  'j':{type:'spring'}, 'T':{type:'tree'},
};
const FILL_T = {W:1,B:1,c:1,$:1};
function buildLevel(idx){
  const def=LEVELS[idx], rows=def.map;
  const h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const grid=[], spawns=[];
  for (let y=0;y<h;y++){
    const row=[];
    for (let x=0;x<w;x++){
      const ch=rows[y][x]||' ';
      if (ch===' '||TILEDEF[ch]) row.push(ch);
      else {
        const mk=(def.marks&&def.marks[ch])||GLOBAL_MARKS[ch];
        if (mk) spawns.push({mk,tx:x,ty:y,ch});
        row.push(null);
      }
    }
    grid.push(row);
  }
  for (const sp of spawns){
    const {tx,ty}=sp; let f=' ';
    for (const c of [grid[ty][tx-1], grid[ty][tx+1], grid[ty-1]&&grid[ty-1][tx]]) if (c && FILL_T[c]){ f=c; break; }
    grid[ty][tx]=f;
  }
  for (let y=0;y<h;y++) for (let x=0;x<w;x++) if (grid[y][x]===null) grid[y][x]=' ';
  const L={def, idx, w, h, grid, theme:def.theme, fake:def.fake||'#', spawns, crumbles:new Map(), pxW:w*TS, pxH:h*TS};
  if (typeof document!=='undefined' && !def.noBake) bakeLevel(L);
  return L;
}

function tAt(tx,ty){
  const L=game.L;
  if (tx<0||tx>=L.w) return '#';
  if (ty<0||ty>=L.h) return ' ';
  return L.grid[ty][tx];
}
function solidAt(tx,ty){
  const c=tAt(tx,ty), d=TILEDEF[c];
  if (!d||!d.s) return false;
  if (d.crumble){ const cr=game.L.crumbles.get(ty*game.L.w+tx); return !cr || cr.st!=='gone'; }
  return true;
}
function onewayAt(tx,ty){
  const c=tAt(tx,ty), d=TILEDEF[c];
  if (d&&d.o) return true;
  return c==='H' && tAt(tx,ty-1)!=='H';
}
function ladderAt(tx,ty){ return tAt(tx,ty)==='H'; }
function convAt(tx,ty){ const d=TILEDEF[tAt(tx,ty)]; return d&&d.conv||0; }

// Move a body along X; returns true on wall contact.
function moveX(b, dx){
  if (!dx) return false;
  b.x+=dx;
  const y0=Math.floor(b.y/TS), y1=Math.floor((b.y+b.h-0.01)/TS);
  let hit=false;
  if (dx>0){
    const tx=Math.floor((b.x+b.w-0.01)/TS);
    for (let ty=y0;ty<=y1;ty++) if (solidAt(tx,ty)){ b.x=tx*TS-b.w; hit=true; break; }
  } else {
    const tx=Math.floor(b.x/TS);
    for (let ty=y0;ty<=y1;ty++) if (solidAt(tx,ty)){ b.x=(tx+1)*TS; hit=true; break; }
  }
  for (const s of game.solids){
    if (!s.solid||s.dead||s.open) continue;
    if (b.x<s.x+s.w && b.x+b.w>s.x && b.y<s.y+s.h && b.y+b.h>s.y){
      if (dx>0) b.x=s.x-b.w; else b.x=s.x+s.w;
      hit=true; b.wallEnt=s;
    }
  }
  return hit;
}
// Move a body along Y; lands on solids, one-ways (unless b.drop>0) and platform entities.
function moveY(b, dy){
  if (!dy) return false;
  const oldBot=b.y+b.h;
  b.y+=dy;
  const x0=Math.floor(b.x/TS), x1=Math.floor((b.x+b.w-0.01)/TS);
  let hit=false;
  if (dy>0){
    const ty=Math.floor((b.y+b.h-0.01)/TS), top=ty*TS;
    for (let tx=x0;tx<=x1;tx++){
      if (solidAt(tx,ty) || (!(b.drop>0) && !b.climb && onewayAt(tx,ty) && oldBot<=top+0.01)){
        b.y=top-b.h; hit=true; b.onEnt=null; break;
      }
    }
    for (const s of game.solids){
      if (s.dead||s.open) continue;
      if (!(b.x<s.x+s.w && b.x+b.w>s.x)) continue;
      if (s.platform){
        if (b.drop>0 || b.climb) continue;
        if (oldBot<=s.y+0.01+Math.max(0,s.dy||0) && b.y+b.h>=s.y){ b.y=s.y-b.h; hit=true; b.onEnt=s; }
      } else if (s.solid && oldBot<=s.y+1 && b.y+b.h>s.y){ b.y=s.y-b.h; hit=true; b.onEnt=s; }
    }
  } else {
    const oldTop=b.y-dy;
    const ty=Math.floor(b.y/TS);
    for (let tx=x0;tx<=x1;tx++) if (solidAt(tx,ty)){ b.y=(ty+1)*TS; hit=true; break; }
    for (const s of game.solids){
      if (!s.solid||s.dead||s.open) continue;
      if (b.x<s.x+s.w && b.x+b.w>s.x && oldTop>=s.y+s.h-1 && b.y<s.y+s.h){ b.y=s.y+s.h; hit=true; }
    }
  }
  return hit;
}
function bodyHitsSolid(b){
  const x0=Math.floor(b.x/TS), x1=Math.floor((b.x+b.w-0.01)/TS);
  const y0=Math.floor(b.y/TS), y1=Math.floor((b.y+b.h-0.01)/TS);
  for (let ty=y0;ty<=y1;ty++) for (let tx=x0;tx<=x1;tx++) if (solidAt(tx,ty)) return true;
  return false;
}
// Spike hitboxes cover only the pointed half of the tile.
function touchesHazard(b){
  const x0=Math.floor((b.x+2)/TS), x1=Math.floor((b.x+b.w-3)/TS);
  const y0=Math.floor((b.y+2)/TS), y1=Math.floor((b.y+b.h-1)/TS);
  for (let ty=y0;ty<=y1;ty++) for (let tx=x0;tx<=x1;tx++){
    const c=tAt(tx,ty);
    if (c==='^' && b.y+b.h>ty*TS+8) return true;
    if (c==='v' && b.y<ty*TS+8) return true;
  }
  return false;
}
function crumbleTouch(tx,ty){
  if (tAt(tx,ty)!=='%') return;
  const k=ty*game.L.w+tx, m=game.L.crumbles;
  if (!m.has(k)) { m.set(k,{st:'shake',t:0.4,tx,ty}); sfx('crumble'); }
}
function updateCrumbles(dt){
  for (const [k,c] of game.L.crumbles){
    c.t-=dt;
    if (c.st==='shake' && c.t<=0){ c.st='gone'; c.t=2.6; spawnParts(c.tx*TS+8,c.ty*TS+8,['#8a7266','#5a4640'],8); }
    else if (c.st==='gone' && c.t<=0){
      const p=game.player, box={x:c.tx*TS,y:c.ty*TS,w:TS,h:TS};
      if (p && boxOverlap(p,box)) c.t=0.3; else game.L.crumbles.delete(k);
    }
  }
}

// ============================================================================
// PLAYER
// ============================================================================
const PHYS = { run:125, accG:1400, decG:1900, accA:1000, decA:520, jump:-385, djump:-330,
  gUp:1100, gDown:1500, maxFall:430, cut:-150, coyote:0.09, buffer:0.12, climb:80, apex:45, apexMul:0.55, conv:52 };

function makePlayer(x,y){
  return { x,y,w:10,h:14, vx:0,vy:0, onGround:false, onEnt:null, wallEnt:null, facing:1,
    coyote:0, jumpBuf:0, airJumps:0, drop:0, climb:false, jumping:false,
    attackT:0, attackCD:0, attackDown:false, hitSet:new Set(),
    invuln:0, knock:0, walkT:0, trail:[], safe:{x,y}, dead:false, deadT:0, hazT:0, idleT:0 };
}
function standingOnOneway(p){
  if (p.onEnt) return !!p.onEnt.platform && !p.onEnt.spring;
  const ty=Math.floor((p.y+p.h+0.5)/TS), x0=Math.floor(p.x/TS), x1=Math.floor((p.x+p.w-0.01)/TS);
  let one=false;
  for (let tx=x0;tx<=x1;tx++){ if (solidAt(tx,ty)) return false; if (onewayAt(tx,ty)) one=true; }
  return one;
}
function carryByPlatform(p){
  const s=p.onEnt;
  if (!s || !s.platform || s.dead || !p.onGround) return;
  if (s.dx) moveX(p, s.dx);
  if (s.dy){ if (s.dy<0){ const oy=p.y; p.y=s.y-p.h; if (bodyHitsSolid(p)){ p.y=oy; } } else p.y=s.y-p.h; }
}

// One fixed physics step. `inp` = {left,right,up,down,jumpP,jumpH,upP}. Pure movement: no combat.
function physicsStep(p, inp, dt){
  const ev={};
  if (p.drop>0) p.drop-=dt;
  const move=(inp.right?1:0)-(inp.left?1:0);
  const cx=Math.floor((p.x+p.w/2)/TS);
  const midTy=Math.floor((p.y+p.h/2)/TS), footTy=Math.floor((p.y+p.h+1)/TS);

  if (!p.climb){
    const onLadder = ladderAt(cx,midTy) || ladderAt(cx,Math.floor((p.y+p.h-2)/TS));
    const canUp = inp.up && onLadder && !(p.jumping && p.vy<-150);
    const canDown = inp.down && p.onGround && ladderAt(cx,footTy) && !inp.jumpP;
    if (canUp || canDown){
      p.climb=true; p.vx=0; p.vy=0; p.jumping=false; p.jumpBuf=0; p.onEnt=null;
      p.x=cx*TS+(TS-p.w)/2;
      if (canDown && !canUp) p.y+=2;
      ev.grab=true;
    }
  }
  if (p.climb){
    p.airJumps = has('boots')?1:0;
    const dir=(inp.down?1:0)-(inp.up?1:0);
    if (inp.jumpP && !inp.upP){
      p.climb=false; p.vy=PHYS.jump*0.8; p.vx=move*PHYS.run; p.jumping=true; ev.jumped=true;
    } else {
      p.vy=dir*PHYS.climb; p.vx=0;
      const hit=moveY(p, p.vy*dt);
      const cy=Math.floor((p.y+p.h/2)/TS), fy=Math.floor((p.y+p.h-1)/TS);
      if (dir>0 && hit){ p.climb=false; p.onGround=true; p.vy=0; }
      else if (!ladderAt(cx,cy) && !ladderAt(cx,fy)){
        p.climb=false;
        if (dir<0 && ladderAt(cx,fy+1)){ p.y=(fy+1)*TS-p.h; p.vy=0; p.onGround=true; }
      }
      else if (move!==0 && dir===0){ p.climb=false; p.vx=move*60; }
      return ev;
    }
  }

  const target=move*PHYS.run;
  if (p.knock>0) p.knock-=dt;
  else {
    const acc = p.onGround ? (move?PHYS.accG:PHYS.decG) : (move?PHYS.accA:PHYS.decA);
    if (p.vx<target) p.vx=Math.min(target,p.vx+acc*dt); else if (p.vx>target) p.vx=Math.max(target,p.vx-acc*dt);
  }
  if (move) p.facing=move;

  if (p.onGround){ p.coyote=PHYS.coyote; p.airJumps=has('boots')?1:0; }
  else p.coyote=Math.max(0,p.coyote-dt);
  if (inp.jumpP) p.jumpBuf=PHYS.buffer; else p.jumpBuf=Math.max(0,p.jumpBuf-dt);
  if (p.jumpBuf>0){
    if (p.onGround && inp.down && standingOnOneway(p)){
      p.drop=0.22; p.y+=1; p.jumpBuf=0; p.onGround=false; p.coyote=0; p.onEnt=null; ev.drop=true;
    } else if (p.coyote>0){
      p.vy=PHYS.jump; p.coyote=0; p.jumpBuf=0; p.onGround=false; p.jumping=true; p.onEnt=null; ev.jumped=true;
    } else if (inp.jumpP && p.airJumps>0){
      p.vy=PHYS.djump; p.airJumps--; p.jumpBuf=0; p.jumping=true; ev.djumped=true;
    }
  }

  let g = p.vy<0 ? (inp.jumpH?PHYS.gUp:PHYS.gDown) : PHYS.gDown;
  if (p.jumping && !inp.jumpH && p.vy<PHYS.cut) p.vy=PHYS.cut;
  if (!p.onGround && inp.jumpH && Math.abs(p.vy)<PHYS.apex) g*=PHYS.apexMul;
  p.vy=Math.min(PHYS.maxFall, p.vy+g*dt);
  if (p.vy>=0) p.jumping=false;

  const wasGround=p.onGround;
  p.wallEnt=null;
  moveX(p, p.vx*dt);
  const vy0=p.vy;
  p.onGround=false;
  if (moveY(p, p.vy*dt)){
    if (vy0>0){ p.onGround=true; if (!wasGround){ ev.landed=true; ev.landVy=vy0; } }
    p.vy=0;
  } else p.onEnt=null;

  if (p.onGround){
    if (p.onEnt && p.onEnt.spring){
      p.vy=-p.onEnt.power; p.onGround=false; p.jumping=false; p.airJumps=has('boots')?1:0; ev.spring=p.onEnt; p.onEnt=null;
    } else if (!p.onEnt){
      const ty=Math.floor((p.y+p.h+0.5)/TS);
      const c=convAt(Math.floor((p.x+p.w/2)/TS),ty);
      if (c) moveX(p, c*PHYS.conv*dt);
    }
  }
  return ev;
}

function readInput(){
  return { left:held.left, right:held.right, up:held.up, down:held.down,
    jumpP:pressed.jump||pressed.up, jumpH:held.jump||held.up, upP:pressed.up };
}

function updatePlayer(dt){
  const p=game.player, s=game.s;
  if (!p) return;
  if (p.dead){
    p.deadT-=dt;
    if (p.deadT<=0 && !game.fade.dir) fadeTo(()=>respawn());
    return;
  }
  if (p.hazT>0){
    p.hazT-=dt;
    if (p.hazT<=0){ p.x=p.safe.x; p.y=p.safe.y; p.vx=p.vy=0; p.invuln=1.2; p.trail.length=0; }
    return;
  }
  carryByPlatform(p);
  const inp=readInput();

  // interact beats attack when something is in reach
  let acted=false;
  game.nearest=findNearest();
  if (pressed.attack && game.nearest && !p.attackT){ interact(game.nearest); acted=true; }
  if (game.dialog||game.menu) return;

  const ev=physicsStep(p, inp, dt);
  if (ev.jumped){ sfx('jump'); dust(p,3); }
  if (ev.djumped){ sfx('djump'); spawnParts(p.x+p.w/2,p.y+p.h,['#fff','#cef'],6,60); }
  if (ev.landed && ev.landVy>200){ sfx('land'); dust(p,4); }
  if (ev.spring){ sfx('spring'); ev.spring.squash=0.2; }
  if (ev.drop) sfx('cursor');

  if (p.onGround){
    const ty=Math.floor((p.y+p.h+0.5)/TS);
    crumbleTouch(Math.floor(p.x/TS),ty); crumbleTouch(Math.floor((p.x+p.w-0.01)/TS),ty);
  }

  // attack
  if (p.attackCD>0) p.attackCD-=dt;
  if (pressed.attack && !acted && p.attackCD<=0 && !p.climb){
    p.attackDown = !p.onGround && held.down;
    p.attackT = p.attackDown ? 0.35 : 0.22;
    p.attackCD = 0.28; p.hitSet.clear(); sfx('attack');
  }
  if (p.attackT>0){
    p.attackT=Math.max(0,p.attackT-dt);
    if (p.attackDown && p.onGround) p.attackT=0;
    if (p.attackT>0) swordHits(p);
  }

  if (pressed.potion){
    if (s.potions>0 && s.hp<s.maxhp){ s.potions--; s.hp=Math.min(s.maxhp,s.hp+4); sfx('heal'); spawnParts(p.x+5,p.y+4,['#f44','#faa'],10); showMsg('Drank a potion.  +2 hearts'); }
    else if (s.potions<=0) showMsg('No potions. Britta and the merchant sell them.');
    else showMsg('Already at full health.');
  }
  if (pressed.abed){
    if (s.scrolls>0){ s.scrolls--; abedSummon(); }
    else showMsg("No Abed's Scrolls left.");
  }
  if (pressed.inv){ openMenu('journal'); return; }
  if (pressed.pause){ openMenu('pause'); return; }

  if (p.wallEnt && p.wallEnt.type==='rubble') bumpRubble(p.wallEnt);

  if (p.invuln>0) p.invuln-=dt;
  if (Math.abs(p.vx)>10 && p.onGround) p.walkT+=dt*Math.abs(p.vx)/12;
  p.idleT = (Math.abs(p.vx)<1 && p.onGround) ? p.idleT+dt : 0;

  if (touchesHazard(p) && !game.god) hazardHit(p);
  else if (p.onGround && !p.onEnt) updateSafe(p);
  if (p.y > game.L.pxH+24){ hazardHit(p, true); }
  if (game.voidOn && p.y+p.h-4 > game.voidY && !p.dead) voidHit(p);

  // Troy follows your footsteps
  const last=p.trail[p.trail.length-1];
  if (!last || Math.abs(last.x-p.x)+Math.abs(last.y-p.y)>=2.5){
    p.trail.push({x:p.x,y:p.y,f:p.facing,c:p.climb});
    if (p.trail.length>13) p.trail.shift();
  }
}
function updateSafe(p){
  const ty=Math.floor((p.y+p.h+0.5)/TS), x0=Math.floor(p.x/TS), x1=Math.floor((p.x+p.w-0.01)/TS);
  for (let tx=x0;tx<=x1;tx++){ const c=tAt(tx,ty); if (c==='%' || !(solidAt(tx,ty)||onewayAt(tx,ty))) return; }
  for (let tx=x0-1;tx<=x1+1;tx++) for (let dy=-1;dy<=0;dy++){ const c=tAt(tx,ty+dy); if (c==='^'||c==='v') return; }
  p.safe.x=p.x; p.safe.y=p.y;
}
function hazardHit(p, pit=false){
  if (p.hazT>0 || p.dead) return;
  damagePlayer(1, null, true);
  if (game.s.hp>0){ p.hazT=0.45; p.vx=p.vy=0; if (!pit) spawnParts(p.x+5,p.y+10,['#fff','#f44'],6); }
}
function voidHit(p){
  damagePlayer(2, null, true);
  if (game.s.hp>0){ fadeTo(()=>respawn(true)); p.hazT=5; }
}
function damagePlayer(n, fromX=null, force=false){
  const p=game.player;
  if (!p || p.dead || game.god) return;
  if (p.invuln>0 && !force) return;
  game.s.hp=Math.max(0,game.s.hp-n);
  p.invuln=1.1; game.shake=Math.max(game.shake,7); sfx('damage');
  if (fromX!==null){ const d=(p.x+p.w/2<fromX)?-1:1; p.vx=d*150; p.vy=-190; p.knock=0.18; p.onGround=false; p.climb=false; }
  game.hitStop=Math.max(game.hitStop,0.06);
  if (game.s.hp<=0){
    p.dead=true; p.deadT=1.1; sfx('death'); game.shake=10;
    spawnParts(p.x+5,p.y+7,['#3a6','#fdb','#a63','#fff'],22,150);
  }
}
function dust(p,n){ spawnParts(p.x+p.w/2,p.y+p.h,['#caa','#dcb'],n,40,0.3); }

function swordBox(p){
  const reach=has('iron_sword')?22:18;
  if (p.attackDown) return {x:p.x-3,y:p.y+p.h-4,w:p.w+6,h:16};
  if (p.attackT<0.08) return null;
  return p.facing>0 ? {x:p.x+p.w-3,y:p.y-4,w:reach,h:p.h+6} : {x:p.x-reach+3,y:p.y-4,w:reach,h:p.h+6};
}
function swordHits(p){
  const box=swordBox(p); if (!box) return;
  const dmg=has('iron_sword')?2:1;
  let pogo=false;
  for (const e of game.ents){
    if (e.dead||e.hidden||p.hitSet.has(e)) continue;
    if (!(e.enemy||e.breakable)) continue;
    if (!boxOverlap(box,e)) continue;
    p.hitSet.add(e);
    if (e.breakable){ breakEntity(e); pogo=true; continue; }
    const r=hurtEnemy(e,dmg,p.attackDown?0:p.facing,p.attackDown?'stab':'sword');
    if (r) pogo=true;
  }
  const b=game.boss;
  if (b && !b.dead && b.vuln && !p.hitSet.has(b) && boxOverlap(box,b)){
    p.hitSet.add(b); hurtBoss(dmg); pogo=true;
  }
  for (const pr of game.projs){
    if (pr.parry && !pr.dead && boxOverlap(box,pr)){ pr.dead=true; sfx('clang'); spawnParts(pr.x,pr.y,['#fff','#fd4'],5); }
  }
  if (p.attackDown){
    const x0=Math.floor(box.x/TS), x1=Math.floor((box.x+box.w)/TS), ty=Math.floor((box.y+box.h-4)/TS);
    for (let tx=x0;tx<=x1;tx++) if (tAt(tx,ty)==='^'){ pogo=true; spawnParts(tx*TS+8,ty*TS+8,['#fff'],4); sfx('clang'); }
    if (pogo){ p.vy=-340; p.jumping=false; p.airJumps=has('boots')?1:0; p.attackT=0; p.invuln=Math.max(p.invuln,0.15); }
  }
}

// ============================================================================
// ENTITIES
// ENT[type] = { w,h, persist, init(e), update(e,dt), touch(e), interact(e), prompt(e), draw(e,sx,sy), back }
// ============================================================================
const ENT = {};
function makeEntity(sp){
  const mk=sp.mk, def=ENT[mk.type];
  if (!def) return null;
  const e={...mk, id:mk.id||(mk.type+'@'+sp.tx+','+sp.ty), tx:sp.tx, ty:sp.ty, dead:false, flash:0, t:0, vx:0, vy:0, def};
  e.w=mk.tw?mk.tw*TS:(mk.w||def.w||14);
  e.h=mk.th?mk.th*TS:(mk.h||def.h||14);
  e.x=mk.tw ? sp.tx*TS+(mk.ox||0) : sp.tx*TS+(TS-e.w)/2+(mk.ox||0);
  e.y=(sp.ty+1)*TS-e.h+(mk.oy||0);
  if (def.init) def.init(e);
  return e;
}
function spawnRunner(spr, x, y, vx, cine){
  const e={type:'runner', def:ENT.runner, id:'runner'+Math.random(), spr, x, y, w:12, h:16, vx, t:0, cine, face:vx>=0?1:-1, dead:false};
  game.ents.push(e);
  return e;
}
function floatText(s,x,y,col='#fff'){ game.texts.push({s,x,y,col,t:0.9}); }
function spawnParts(x,y,cols,n,spd=110,life=0.6){
  for (let i=0;i<n;i++) game.parts.push({x,y,vx:(Math.random()-0.5)*spd*2,vy:(Math.random()-0.85)*spd*1.6,c:cols[i%cols.length],life:life*(0.6+Math.random()*0.6),g:420});
}

ENT.dropheart = { w:12, h:12,

    else if (L==='potion'){ game.s.potions++; sfx('item'); showMsg('A potion was inside!'); }

}

// ---------------------------------------------------------------- enemies
function enemyInit(e,hp,gibs){ e.enemy=true; e.hp=hp; e.maxhp=hp; e.facing=e.facing||-1; e.onGround=false; e.kb=0; e.gibs=gibs; }
function walkerPhys(e,dt,speed){
  e.vy=Math.min(PHYS.maxFall,e.vy+PHYS.gDown*dt);
  let vx;
  if (e.kb>0){ e.kb-=dt; vx=e.vx; e.vx*=0.88; } else vx=e.facing*speed;
  if (moveX(e,vx*dt) && e.kb<=0) e.facing*=-1;
  e.onGround=false;
  if (moveY(e,e.vy*dt)){ if (e.vy>0) e.onGround=true; e.vy=0; }
  if (e.onGround && e.kb<=0 && speed>0){
    const ax=Math.floor((e.facing>0?e.x+e.w+1:e.x-1)/TS), by=Math.floor((e.y+e.h+1)/TS);
    const fy=Math.floor((e.y+e.h-1)/TS);
    if ((!solidAt(ax,by)&&!onewayAt(ax,by)) || tAt(ax,by)==='^' || tAt(ax,fy)==='^') e.facing*=-1;
  }
  if (e.y>game.L.pxH+40) e.dead=true;
}
function enemyTouch(e,dmg=1){
  const p=game.player;
  if (!p||p.dead||p.hazT>0||!boxOverlap(e,p)) return;
  if (p.vy>40 && p.y+p.h-e.y<10 && e.stomp!==false){
    p.vy=-310; p.jumping=false; p.airJumps=has('boots')?1:0;
    hurtEnemy(e,2,0,'stomp');
    return;
  }
  damagePlayer(dmg, e.x+e.w/2);
}
function hurtEnemy(e,dmg,dir,src){
  if (e.dead) return false;
  if (e.flash>0 && src!=='abed') return false;
  if (e.type==='knight' && src==='sword' && dir===-e.facing && e.state!=='recover'){
    sfx('clang'); spawnParts(e.facing>0?e.x+e.w:e.x, e.y+7, ['#fff','#fd4'],6,90,0.3);
    const p=game.player; p.vx=-dir*150; p.knock=0.12; e.vx=dir*50; e.kb=0.08;
    return false;
  }
  e.hp-=dmg; e.flash=0.2;
  if (dir){ e.vx=dir*130; e.kb=0.15; }
  game.hitStop=Math.max(game.hitStop,0.045);
  spawnParts(e.x+e.w/2,e.y+e.h/2,['#fff'],3,60,0.3);
  if (e.hp<=0) killEnemy(e); else sfx('hit');
  return true;
}
function killEnemy(e){
  e.dead=true; sfx('enemy_die'); game.s.violence++;
  spawnParts(e.x+e.w/2,e.y+e.h/2,e.gibs||['#9e4','#062'],12,120);
  game.hitStop=Math.max(game.hitStop,0.07);
  if (e.noDrop) return;
  const r=Math.random();
  if (r<0.35) dropPickup('dropcoin',e.x+e.w/2,e.y+e.h/2);
  else if (r<0.45) dropPickup('dropheart',e.x+e.w/2,e.y+e.h/2);
}
function nearPlayer(e,rx,ry){ const p=game.player; return p && Math.abs(p.x-e.x)<rx && Math.abs(p.y-e.y)<ry; }

    const p=game.player;

    if (e.onGround && e.kb<=0){
      e.vx*=0.7; e.t-=dt;
      if (e.t<=0){
        const near=nearPlayer(e,130,60);
        e.facing = near ? (Math.sign(p.x-e.x)||1) : (Math.random()<0.5?-1:1);
        e.vy=near?-240:-150; e.vx=e.facing*(near?72:40); e.t=near?0.85:rnd(1.1,2); e.onGround=false;
      }
    }
    if (moveX(e,e.vx*dt)) e.vx=-e.vx;
    const air=!e.onGround; e.onGround=false;
    if (moveY(e,e.vy*dt)){ if (e.vy>0){ e.onGround=true; if (air) e.squash=0.15; } e.vy=0; }
    if (e.squash>0) e.squash-=dt;
    if (e.y>game.L.pxH+40) e.dead=true;
    enemyTouch(e);

  update(e,dt){
    const p=game.player; e.t+=dt;
    const pcx=p.x+p.w/2, pcy=p.y+p.h/2;
    if (e.kb>0){ e.kb-=dt; e.x+=e.vx*dt; }
    if (e.state==='roost'){
      if (e.t>1 && Math.abs(pcx-(e.x+6))<80 && pcy>e.y && pcy-e.y<150){ e.state='wake'; e.t=0; }
    } else if (e.state==='wake'){
      if (e.t>0.4){ e.state='swoop'; e.t=0; const dx=pcx-(e.x+6), dy=pcy-(e.y+4), d=Math.hypot(dx,dy)||1; e.vx=dx/d*130; e.vy=dy/d*130; }
    } else if (e.state==='swoop'){
      e.x+=e.vx*dt; e.y+=e.vy*dt; e.vy-=40*dt;
      if (e.t>1.1 || bodyHitsSolid(e)){ if (bodyHitsSolid(e)){ e.x-=e.vx*dt; e.y-=e.vy*dt; } e.state='return'; e.t=0; }

// ---------------------------------------------------------------- projectiles
function updateProjs(dt){
  const p=game.player;
  for (const pr of game.projs){
    if (pr.dead) continue;
    pr.life-=dt; if (pr.life<=0){ pr.dead=true; continue; }
    if (pr.grav) pr.vy+=pr.grav*dt;
    if (pr.sway){ pr.t=(pr.t||0)+dt; pr.vx=Math.sin(pr.t*3+pr.sway)*50; }
    pr.x+=pr.vx*dt; pr.y+=pr.vy*dt;
    if (!pr.ghost && solidAt(Math.floor((pr.x+pr.w/2)/TS),Math.floor((pr.y+pr.h/2)/TS))){ pr.dead=true; spawnParts(pr.x,pr.y,['#fff','#aaa'],3,40,0.3); continue; }
    if (p && !p.dead && p.hazT<=0 && boxOverlap(pr,p)){ pr.dead=true; damagePlayer(pr.dmg||1, pr.x); }
  }
  game.projs=game.projs.filter(q=>!q.dead);
}
function drawProjs(){
  for (const pr of game.projs){
    const sx=Math.round(pr.x-game.cam.x), sy=Math.round(pr.y-game.cam.y);
    if (pr.kind==='arrow'){
      ctx.fillStyle='#c95'; ctx.fillRect(sx,sy+1,8,1);
      ctx.fillStyle='#ddd'; const hx=pr.vx>0?sx+7:sx-1; ctx.fillRect(hx,sy,2,3);
      ctx.fillStyle='#fff'; const fx=pr.vx>0?sx:sx+6; ctx.fillRect(fx,sy,2,1); ctx.fillRect(fx,sy+2,2,1);
    } else if (pr.kind==='paper'){
      ctx.fillStyle='#eee'; ctx.fillRect(sx,sy,8,6); ctx.fillStyle='#aaa'; ctx.fillRect(sx+1,sy+2,6,1); ctx.fillRect(sx+1,sy+4,4,1);
    } else if (pr.kind==='wipe'){
      ctx.fillStyle='#fff'; ctx.fillRect(sx,sy,9,7); ctx.fillStyle='#7af'; ctx.fillRect(sx,sy,9,1); ctx.fillRect(sx,sy+6,9,1); ctx.fillStyle='#26d'; ctx.fillRect(sx+3,sy+2,3,3);
    } else {
      const f=Math.floor(game.time*20)%2;
      ctx.fillStyle='#f72'; ctx.fillRect(sx,sy,pr.w,pr.h);
      ctx.fillStyle=f?'#fd4':'#fff6b0'; ctx.fillRect(sx+2,sy+2,pr.w-4,pr.h-4);
    }
  }
}

  game.voidY-=speed*dt;

// ---------------------------------------------------------------- Abed's scroll
function abedSummon(){
  game.abedFx=1.2; sfx('spell'); game.shake=10;
  let killed=0;
  for (const e of game.ents){
    if (e.dead||!e.enemy) continue;
    const sx=e.x-game.cam.x, sy=e.y-game.cam.y;
    if (sx>-32 && sx<W+32 && sy>-32 && sy<H+32){ hurtEnemy(e,99,0,'abed'); killed++; }
  }
  for (const pr of game.projs) pr.dead=true;
  if (game.boss && !game.boss.dead && game.boss.vuln!==false) hurtBoss(4, true);
  for (let i=0;i<30;i++) spawnParts(game.cam.x+Math.random()*W, game.cam.y+30+Math.random()*170, ['#7af','#fd4','#0ff','#fff'], 1, 60);
  const lines=["I've seen this episode.","Cool. Cool cool cool.","This is the part where I'm useful.","Magic missile. Ironically.","You're welcome, Jeff."];
  showMsg('ABED: "'+lines[(Math.random()*lines.length)|0]+'"'+(killed?'  ('+killed+' foes)':''), 3);
}

function lockArena(a){ if (a) game.lock={x0:a[0]*TS, x1:a[1]*TS}; }
function startBoss(kind, trig){
  const p=game.player;
  if (kind==='gilbert'){
    const ax1 = game.lock ? game.lock.x1 : p.x+160;
    game.boss={kind, x:ax1-40, y:p.y-10, w:12, h:16, vx:0, vy:0, hp:14, maxhp:14, facing:-1,
      state:'intro', t:0.6, throwT:1.6, dashT:4.5, leapT:3, flash:0, inv:0, vuln:true, onGround:false, name:'GILBERT LAWSON'};
    playTrack('duel');
  } else {
    game.boss={kind, x:W/2-16, y:40, w:30, h:30, hp:24, maxhp:24, phase:1, state:'float', t:0, atkT:2.2, swoopT:7,
      flash:0, inv:0, vuln:true, name:'CORNELIUS HAWTHORNE', rainT:0, ft:0, eyes:0, abed:null};
    playTrack('boss');
  }
}
function hurtBoss(dmg, fromAbed=false){
  const b=game.boss;
  if (!b || b.dead || b.state==='dying') return;
  if (!b.vuln) { if (!fromAbed){ sfx('clang'); } return; }
  if (b.inv>0 && !fromAbed) return;
  b.hp=Math.max(0,b.hp-dmg); b.flash=0.25; b.inv=0.3;
  sfx('boss_hit'); game.shake=Math.max(game.shake,5); game.hitStop=Math.max(game.hitStop,0.06);
  spawnParts(b.x+b.w/2,b.y+b.h/2,['#fff','#fd4'],6,100,0.4);
  if (b.kind==='gilbert'){
    const p=game.player; b.vx=(b.x<p.x?-1:1)*110; b.kbT=0.15;
  }
  if (b.hp<=0){ b.state='dying'; b.t=b.kind==='gilbert'?0.8:2.2; b.vuln=false; game.projs.length=0; playTrack(null); sfx('rumble'); return; }
  if (b.kind==='cornelius'){
    if (b.phase===1 && b.hp<=16){ b.phase=2; game.projs.length=0; sayOnce('boss_phase2'); }
    else if (b.phase===2 && b.hp<=8){ b.phase=3; b.vuln=false; b.shield=true; game.projs.length=0; b.state='float';
      const cb=()=>{ b.abed={x:W/2-8,y:-30,t:0,castT:4}; b.shieldBreak=1; };
      if (F('abedArrived')) cb(); else { setF('abedArrived'); say('boss_phase3', cb); } }
  }
}
function sayOnce(key){ if (!F('said_'+key)){ setF('said_'+key); say(key); } }

function updateBoss(dt){
  const b=game.boss; if (!b) return;
  const p=game.player;
  if (b.flash>0) b.flash-=dt;
  if (b.inv>0) b.inv-=dt;
  if (b.state==='dying'){
    b.t-=dt;
    if (Math.random()<dt*14) spawnParts(b.x+Math.random()*b.w,b.y+Math.random()*b.h,['#fd4','#f72','#fff','#e22'],6,140);
    game.shake=Math.max(game.shake,3);
    if (b.t<=0 && !b.dead){ b.dead=true; defeatBoss(b); }
    return;
  }
  if (b.dead) return;
  if (b.kind==='gilbert') updateGilbert(b,dt,p); else updateCornelius(b,dt,p);
}

function updateGilbert(b,dt,p){
  const enraged=b.hp<=b.maxhp/2;
  const dx=(p.x+p.w/2)-(b.x+b.w/2);
  b.vy=Math.min(PHYS.maxFall,b.vy+PHYS.gDown*dt);
  let vx=0;
  b.t-=dt;
  if (b.kbT>0){ b.kbT-=dt; vx=b.vx; }
  else if (b.state==='intro'){ if (b.t<=0) b.state='walk'; }
  else if (b.state==='walk'){
    b.facing=Math.sign(dx)||b.facing;
    const want = Math.abs(dx)>90 ? 1 : (Math.abs(dx)<50 ? -1 : 0);
    vx = b.facing*want*(enraged?80:62);
    b.throwT-=dt; b.dashT-=dt; b.leapT-=dt;
    if (b.dashT<=0 && b.onGround){ b.state='windup'; b.t=0.5; b.dashT=enraged?3.2:4.4; }
    else if (b.leapT<=0 && b.onGround){ b.state='leap'; b.vy=-400; b.leapVx=clamp(dx*1.4,-190,190); b.onGround=false; b.leapT=enraged?3.5:5; sfx('jump'); }
    else if (b.throwT<=0){ b.state='throwing'; b.t=0.35; b.throwT=enraged?1.5:2.1; }
  }
  else if (b.state==='throwing'){
    b.facing=Math.sign(dx)||b.facing;
    if (b.t<=0){
      const n=enraged?3:1;
      for (let i=0;i<n;i++){
        const spread=(i-(n-1)/2)*45;
        game.projs.push({kind:'paper',x:b.x+2,y:b.y+2,w:8,h:6,vx:b.facing*150+spread,vy:-170-Math.abs(spread)*0.6,grav:430,life:3,dmg:1,parry:true});
      }
      sfx('attack'); b.state='walk';
    }
  }
  else if (b.state==='windup'){ b.facing=Math.sign(dx)||b.facing; if (b.t<=0){ b.state='dash'; b.t=0.45; sfx('djump'); } }
  else if (b.state==='dash'){ vx=b.facing*290; if (Math.random()<0.5) spawnParts(b.x+6,b.y+15,['#caa'],1,30,0.3); if (b.t<=0){ b.state='tired'; b.t=0.9; } }
  else if (b.state==='tired'){ if (b.t<=0) b.state='walk'; }
  else if (b.state==='leap'){ vx=b.leapVx; }
  if (moveX(b,vx*dt) && b.state==='dash'){ b.state='tired'; b.t=1.1; game.shake=6; sfx('hit'); }
  if (game.lock){ b.x=clamp(b.x,game.lock.x0+2,game.lock.x1-b.w-2); }
  const air=!b.onGround; b.onGround=false;
  if (moveY(b,b.vy*dt)){ if (b.vy>0){ b.onGround=true; if (air && b.state==='leap'){ b.state='walk'; game.shake=5; sfx('land'); spawnParts(b.x+6,b.y+16,['#caa','#fff'],8,90,0.4); } } b.vy=0; }
  if (boxOverlap(b,p) && !p.dead) damagePlayer(b.state==='dash'?2:1, b.x+b.w/2);
}

function updateCornelius(b,dt,p){
  b.ft+=dt; b.t+=dt;
  const px=p.x+p.w/2, py=p.y+p.h/2;
  const cx=b.x+b.w/2, cy=b.y+b.h/2;
  const arenaW=game.L.pxW;
  if (b.shieldBreak>0){ b.shieldBreak-=dt*0.6; if (b.shieldBreak<=0){ b.shield=false; b.vuln=true; sfx('smash'); game.shake=12; spawnParts(cx,cy,['#7af','#fff','#0ff'],30,160); } }
  if (b.abed){
    const a=b.abed; a.t+=dt; a.y=Math.min(24,a.y+40*dt); a.x=W/2-8+Math.sin(a.t*0.8)*60;
    a.castT-=dt;
    if (a.castT<=0 && !b.shield){ a.castT=5; game.projs.push({kind:'bolt',x:a.x+8,y:a.y+10,w:0,h:0,friendly:true,life:3}); b.pendingBolt=0.5; }
    if (b.pendingBolt>0){ b.pendingBolt-=dt; if (b.pendingBolt<=0){ hurtBoss(1,true); sfx('spell'); spawnParts(cx,cy,['#7af','#fff'],10,100); } }
  }
  game.projs=game.projs.filter(q=>!q.friendly);

  if (b.state==='float'){
    const tx=arenaW/2-b.w/2+Math.sin(b.ft*0.7)*(arenaW/2-50);
    const ty=46+Math.sin(b.ft*1.4)*16+(b.phase===3?10:0);
    b.x+=(tx-b.x)*Math.min(1,dt*2.2); b.y+=(ty-b.y)*Math.min(1,dt*2.2);
    b.atkT-=dt; b.swoopT-=dt;
    if (b.atkT<0.55) b.eyes=1; else b.eyes=0;
    if (b.atkT<=0){
      if (b.phase===3){
        for (let i=0;i<10;i++){ const a=i/10*Math.PI*2+b.ft; game.projs.push({kind:'fire',x:cx-4,y:cy-4,w:8,h:8,vx:Math.cos(a)*95,vy:Math.sin(a)*95,life:4,dmg:1,ghost:true}); }
        b.atkT=2.3;
      } else {
        const n=b.phase===1?3:5, a0=Math.atan2(py-cy,px-cx), spd=b.phase===1?120:135;
        for (let i=0;i<n;i++){ const a=a0+(i-(n-1)/2)*0.3; game.projs.push({kind:'fire',x:cx-4,y:cy-4,w:8,h:8,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:4,dmg:1,ghost:true}); }
        b.atkT=b.phase===1?2.1:1.7;
      }
      sfx('fire');
    }
    if (b.swoopT<=0 && !b.shield){
      b.state='warn'; b.t=0; b.swoopY=clamp(p.y+p.h-26,40,game.L.pxH-60);
      b.swoopDir = cx<arenaW/2 ? 1 : -1;
      b.swoopT = b.phase===1?7.5:5.5;
    }
    if (b.phase>=2 && !b.shield){
      b.rainT-=dt;
      if (b.rainT<=0){ b.rainT=b.phase===2?0.55:0.9; game.projs.push({kind:'wipe',x:20+Math.random()*(arenaW-40),y:-8,w:9,h:7,vx:0,vy:55,sway:Math.random()*6,life:6,dmg:1,ghost:true}); }
    }
  }
  else if (b.state==='warn'){
    const sx = b.swoopDir>0 ? -10 : arenaW-b.w+10;
    b.x+=(sx-b.x)*Math.min(1,dt*4); b.y+=(b.swoopY-b.y)*Math.min(1,dt*4);
    if (b.t>0.9){ b.state='swoop'; b.t=0; sfx('djump'); }
  }
  else if (b.state==='swoop'){
    b.x+=b.swoopDir*270*dt;
    if (Math.random()<0.6) spawnParts(cx-b.swoopDir*12,cy,['#f72','#fd4'],1,40,0.4);
    if ((b.swoopDir>0 && b.x>arenaW-b.w-6) || (b.swoopDir<0 && b.x<6)){ b.state='rest'; b.t=0; }
  }
  else if (b.state==='rest'){
    b.y+=Math.sin(b.t*6)*0.3;
    if (b.t>1.6){ b.state='float'; b.atkT=1.2; }
  }
  if (boxOverlap({x:b.x+3,y:b.y+3,w:b.w-6,h:b.h-6},p) && !p.dead) damagePlayer(b.state==='swoop'?2:1, cx);
}

function defeatBoss(b){
  game.projs.length=0;
  if (b.kind==='gilbert'){
    setF('gilbertBeaten'); spawnParts(b.x+6,b.y+8,['#fff','#aaa'],10,80);
    say('gilbert_defeated', ()=>{ game.boss=null; game.lock=null; playTrack('castle');
      setQuest('Enter the throne room.'); game.s.hp=game.s.maxhp; saveGame(); });
  } else {
    spawnParts(b.x+b.w/2,b.y+b.h/2,['#e22','#fd4','#fff','#f0f','#0ff'],60,220,1.2);
    game.shake=16; sfx('win');
    setTimeout(()=>{ game.boss=null; playTrack('sad');
      const pr=spawnRunner(pierce, -20, game.L.pxH-3*TS-16, 60, true); pr.after=0; pr.stopAt=W/2-60;
      say('boss_down'); }, 900);
  }
}

function drawBoss(){
  const b=game.boss; if (!b) return;
  const sx=Math.round(b.x-game.cam.x), sy=Math.round(b.y-game.cam.y);
  const blink=b.flash>0 && Math.floor(b.flash*30)%2===0;
  if (b.kind==='gilbert'){
    if (b.dead) return;
    const tele=(b.state==='windup'||b.state==='throwing') && Math.floor(game.time*16)%2===0;
    const tired=b.state==='tired';
    drawSprite(gilbert,sx-2,sy+(tired?1:0),b.facing>0,1,blink||tele);
    if (tired){ ctx.fillStyle='#7af'; ctx.fillRect(sx+2,sy-4+Math.round(Math.sin(game.time*8)),2,2); ctx.fillRect(sx+8,sy-5+Math.round(Math.cos(game.time*8)),2,2); }
    if (b.state==='windup'){ txt('!',sx+3,sy-12,'#f44'); }
  } else {
    if (b.dead) return;
    if (b.state==='warn'){
      const a=0.25+0.25*Math.sin(game.time*30);
      ctx.fillStyle=`rgba(255,60,40,${a})`; ctx.fillRect(0,Math.round(b.swoopY-game.cam.y)+6,W,b.h-12);
    }
    const shake = b.state==='dying' ? Math.round(Math.sin(game.time*50)*2) : 0;
    drawSprite(cornelius_boss,sx-1+shake,sy-1,false,1,blink,2);
    if (b.eyes){ ctx.fillStyle='#ff0'; ctx.fillRect(sx+13,sy+10,3,2); ctx.fillRect(sx+17,sy+10,3,2); ctx.fillRect(sx+21,sy+10,3,2); }
    if (b.shield){
      const r=24+Math.sin(game.time*6)*2, a=b.shieldBreak>0?b.shieldBreak:1;
      ctx.strokeStyle=`rgba(160,120,255,${0.8*a})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(sx+15,sy+15,r,0,7); ctx.stroke();
      ctx.fillStyle=`rgba(160,120,255,${0.15*a})`; ctx.beginPath(); ctx.arc(sx+15,sy+15,r,0,7); ctx.fill();
    }
    if (b.abed){
      const a=b.abed, ax=Math.round(a.x), ay=Math.round(a.y);
      ctx.fillStyle='rgba(120,180,255,0.18)'; ctx.fillRect(ax-2,0,20,ay+16);
      drawSprite(abed,ax,ay);
      if (b.pendingBolt>0){ ctx.strokeStyle='#bdf'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ax+8,ay+12); ctx.lineTo(sx+15+rnd(-3,3),sy+15+rnd(-3,3)); ctx.stroke(); }
    }
  }
}
function drawBossBar(){
  const b=game.boss; if (!b || b.dead || b.state==='intro' && b.t>0.4) return;
  const bw=150, bx=(W-bw)/2, by=H-16;

  ctx.fillStyle='#400'; ctx.fillRect(bx,by,bw,5);
  ctx.fillStyle=b.vuln?'#e22':'#96f'; ctx.fillRect(bx,by,Math.round(bw*b.hp/b.maxhp),5);
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fillRect(bx,by,Math.round(bw*b.hp/b.maxhp),1);
}

function skyGrad(top,bot){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,top); g.addColorStop(1,bot);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function par(x,f,span){ const v=(x-game.cam.x*f)%span; return v<0?v+span:v; }
function puff(x,y,s,a=0.92){
  ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.beginPath();
  ctx.arc(x,y,5*s,0,7); ctx.arc(x+7*s,y-2*s,7*s,0,7); ctx.arc(x+15*s,y,6*s,0,7); ctx.arc(x+8*s,y+3*s,6*s,0,7); ctx.fill();
}
function hills(col, base, amp, period, f, yoff){
  const cy=(game.cam.y-(game.L.pxH-H))*f*0.5;
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,H);
  for (let x=0;x<=W;x+=4){ const wx=x+game.cam.x*f; ctx.lineTo(x, base-cy+yoff+Math.sin(wx/period)*amp+Math.sin(wx/(period*0.37))*amp*0.35); }
  ctx.lineTo(W,H); ctx.fill();
}
function drawBackground(){
  const th=game.L.theme, t=game.time, cy=game.cam.y-(game.L.pxH-H);
  if (th==='village'){
    skyGrad('#4ab8e8','#c4ebf4');
    ctx.fillStyle='rgba(255,242,186,0.9)'; ctx.beginPath(); ctx.arc(W-56,40-cy*0.05,18,0,7); ctx.fill();
    for (let i=0;i<7;i++) puff(par(i*170+t*4,0.08,W+200)-100, 26+(i%3)*20-cy*0.05, 0.8+(i%2)*0.4);
    hills('#9ccfd6',150,14,90,0.1,0);
    hills('#7bc88f',175,18,70,0.25,0);
    hills('#4a9a5e',200,12,50,0.45,0);
  } else if (th==='cave'){
    skyGrad('#140d0d','#060304');
    for (let i=0;i<40;i++){
      const x=par(i*61,0.25,W+40)-20, y=((i*97-cy*0.25)%(H+20)+H+20)%(H+20)-10;
      ctx.fillStyle=i%5===0?'rgba(120,200,255,0.2)':'rgba(80,62,52,0.5)'; ctx.fillRect(x,y,2,2);
    }
    ctx.fillStyle='#1c1212';
    for (let i=0;i<10;i++){ const x=par(i*90,0.4,W+90)-45, y=((i*140-cy*0.4)%(H+80)+H+80)%(H+80)-40; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+14,y); ctx.lineTo(x+7,y+30); ctx.fill(); }
  } else if (th==='wipes'){
    skyGrad('#f4b870','#fbe6b8');
    ctx.fillStyle='rgba(255,250,220,0.9)'; ctx.beginPath(); ctx.arc(60,50-cy*0.05,20,0,7); ctx.fill();
    for (let i=0;i<5;i++) puff(par(i*200+t*6,0.06,W+220)-110, 30+(i%2)*18-cy*0.05, 1, 0.8);
    const my=-cy*0.4;
    ctx.fillStyle='#b8a4b8';
    for (let i=0;i<9;i++){ const x=par(i*150,0.12,W+300)-150; ctx.beginPath(); ctx.moveTo(x,200+my); ctx.lineTo(x+75,70+my); ctx.lineTo(x+150,200+my); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(x+58,100+my); ctx.lineTo(x+75,70+my); ctx.lineTo(x+92,100+my); ctx.fill(); ctx.fillStyle='#b8a4b8'; }
    const fy=-cy*0.55;
    for (let i=0;i<5;i++){
      const x=par(i*260,0.3,W+260)-130;
      ctx.fillStyle='#8a6a7a'; ctx.fillRect(x,150+fy,80,90); ctx.fillRect(x+10,110+fy,12,40); ctx.fillRect(x+50,120+fy,10,30);
      for (let j=0;j<4;j++){ const k=(t*0.3+j/4)%1; ctx.fillStyle=`rgba(255,255,255,${0.5*(1-k)})`; ctx.beginPath(); ctx.arc(x+16+Math.sin(k*5+i)*6,110+fy-k*50,4+k*9,0,7); ctx.fill(); }
      ctx.fillStyle='#ffe08a'; for (let j=0;j<3;j++) ctx.fillRect(x+10+j*22,170+fy,8,6);
    }
    hills('#c89a58',205,10,60,0.5,0);
  } else if (th==='castle'){
    skyGrad('#1c1234','#06030c');
    for (let i=0;i<40;i++){ ctx.fillStyle=(i%3)?'#445':'#aab'; ctx.fillRect(par(i*47,0.05,W+20)-10,((i*71)%150)-cy*0.03,1,1); }
    ctx.fillStyle='rgba(232,232,255,0.6)'; ctx.beginPath(); ctx.arc(W-50,40-cy*0.04,14,0,7); ctx.fill();
    ctx.fillStyle='#150c24';
    for (let i=0;i<7;i++){ const x=par(i*140,0.15,W+140)-70, y=90-cy*0.15; ctx.fillRect(x,y,34,400); ctx.beginPath(); ctx.moveTo(x-6,y); ctx.lineTo(x+17,y-28); ctx.lineTo(x+40,y); ctx.fill(); }

  }
}

function drawWorld(){
  const L=game.L, cx=Math.round(game.cam.x), cy=Math.round(game.cam.y);
  ctx.drawImage(L.bake, cx, cy, W, H, 0, 0, W, H);
  const tx0=Math.floor(cx/TS), tx1=Math.min(L.w-1,Math.floor((cx+W)/TS));
  const ty0=Math.max(0,Math.floor(cy/TS)), ty1=Math.min(L.h-1,Math.floor((cy+H)/TS));
  for (let ty=ty0;ty<=ty1;ty++) for (let tx=tx0;tx<=tx1;tx++){
    const c=L.grid[ty][tx]; if (c===' ') continue;
    const d=TILEDEF[c]; if (!d||!(d.dyn||c==='t')) continue;
    const x=tx*TS-cx, y=ty*TS-cy;
    if (c==='%') drawCrumble(tx,ty,x,y);
    else if (c==='<'||c==='>') drawConveyor(x,y,d.conv);
    else if (c==='t'){ const f=Math.sin(game.time*15+tx)*1.2; ctx.fillStyle='#f72'; ctx.fillRect(x+5,y+1+f,6,6); ctx.fillStyle='#fd4'; ctx.fillRect(x+6,y+2+f,4,4); ctx.fillStyle='#fff8d0'; ctx.fillRect(x+7,y+4,2,2); }
  }
}
function drawCrumble(tx,ty,x,y){
  const c=game.L.crumbles.get(ty*game.L.w+tx);
  if (c && c.st==='gone'){ if (c.t<0.4){ ctx.globalAlpha=0.35; } else return; }
  const o = c && c.st==='shake' ? Math.round(Math.sin(game.time*70)) : 0;
  ctx.fillStyle='#8a7266'; ctx.fillRect(x+o,y,16,16);
  ctx.fillStyle='#b09a88'; ctx.fillRect(x+o,y,16,2);

function lightsInView(){
  const out=[], cx=game.cam.x, cy=game.cam.y, L=game.L;

  for (let ty=ty0;ty<=ty1;ty++) for (let tx=tx0;tx<=tx1;tx++){ const d=TILEDEF[L.grid[ty][tx]]; if (d&&d.light) out.push([tx*TS+8-cx,ty*TS+10-cy,d.light]); }
  for (const e of game.ents){
    if (e.dead||!e.def.light) continue;
    const r=typeof e.def.light==='function'?e.def.light(e):e.def.light;
    if (r) out.push([e.x+e.w/2-cx,e.y+e.h/2-cy,r]);

const NAME_COL = { JEFF:'#8e8', ABED:'#7af', 'ABED (LETTER)':'#7af', TROY:'#f77', 'TROY (COUCH)':'#f77', BRITTA:'#9e4', ANNIE:'#8bf',
  SHIRLEY:'#c9f', PIERCE:'#eca', GILBERT:'#ddd', CORNELIUS:'#f55', NARRATOR:'#fc4' };
function say(key, after){
  const seq = typeof key==='string' ? DIALOG[key] : key;
  if (!seq){ if (after) after(); return; }
  game.dialog={q:seq, i:-1, line:null, chars:0, t:0, after, choice:0, opts:null};
  advanceDialog();
}
function advanceDialog(){
  const d=game.dialog;
  for (;;){
    d.i++;
    const ln=d.q[d.i];
    if (!ln){ endDialog(); return; }
    if (ln.if && !ln.if()) continue;
    if (ln.do){ ln.do(); if (game.dialog!==d) return; continue; }
    d.line=ln; d.chars=0; d.t=0;
    if (ln.choice){ d.opts=ln.choice.filter(c=>!c.if||c.if()); d.choice=0; }
    return;
  }
}
function endDialog(){ const d=game.dialog; game.dialog=null; if (d&&d.after) d.after(); }
function updateDialog(dt){
  const d=game.dialog; if (!d||!d.line) return;
  if (d.line.choice){
    if (pressed.up){ d.choice=(d.choice-1+d.opts.length)%d.opts.length; sfx('cursor'); }
    if (pressed.down){ d.choice=(d.choice+1)%d.opts.length; sfx('cursor'); }
    if (pressed.attack||pressed.confirm||pressed.jump){
      sfx('select'); const o=d.opts[d.choice]; game.dialog=null; if (o.go) o.go();
    }
    return;
  }
  const len=normText(d.line.t).length, before=d.chars;
  d.t+=dt; d.chars=Math.min(len,Math.floor(d.t*55));
  if (Math.floor(d.chars/2)>Math.floor(before/2)){ const sp=d.line.s||''; sfx('blip', 300+((sp.charCodeAt(0)||70)%10)*40); }
  if (pressed.attack||pressed.confirm||pressed.jump){
    if (d.chars<len){ d.chars=len; d.t=len/55; }
    else { sfx('cursor'); advanceDialog(); }
  }
}
function drawPortrait(spk,x,y){
  const spr=PORTRAITS[spk];
  let bg='#1a1e2e';
  if (spk==='CORNELIUS') bg='#3a0e16';
  if (spk&&spk.includes('LETTER')) bg='#5a4a2a';
  if (spk&&spk.includes('COUCH')) bg='#3a2a4a';
  panel(x,y,38,38,bg,NAME_COL[spk]||'#fc4');
  if (spr) drawSprite(spr,x+3,y+3,false,1,false,2);
  if (spk&&spk.includes('COUCH')){ ctx.fillStyle='#6a3a2a'; ctx.fillRect(x+2,y+28,34,8); ctx.fillStyle='#8a4a3a'; ctx.fillRect(x+2,y+28,34,2); }
  if (spk&&spk.includes('LETTER')){ ctx.fillStyle='#f2e2b6'; ctx.fillRect(x+22,y+22,13,11); ctx.fillStyle='#9a7a4a'; ctx.fillRect(x+24,y+25,9,1); ctx.fillRect(x+24,y+28,7,1); }
}
function drawDialog(){
  const d=game.dialog; if (!d||!d.line) return;
  const bx=6, by=H-68, bw=W-12, bh=62;
  panel(bx,by,bw,bh,'rgba(6,8,18,0.94)','#fc4');
  if (d.line.choice){
    txt(d.line.prompt||'Choose:', bx+10, by+7, '#fc4');
    d.opts.forEach((o,i)=>{
      const sel=i===d.choice;
      if (sel){ ctx.fillStyle='#2a2410'; ctx.fillRect(bx+6,by+18+i*13,bw-12,11); }
      txt((sel?'▶ ':'  ')+o.label, bx+10, by+20+i*13, sel?'#fc4':'#ddd');
    });
    return;
  }
  const spk=d.line.s, hasP=!!PORTRAITS[spk];
  const tx = hasP ? bx+48 : bx+10;
  if (hasP) drawPortrait(spk,bx+5,by+12);
  const nm=spk==='NARRATOR'?'':spk;
  if (nm){ const w=textWidth(nm)+8; ctx.fillStyle='rgba(6,8,18,0.94)'; ctx.fillRect(bx+6,by-9,w,10); ctx.fillStyle=NAME_COL[spk]||'#fc4'; ctx.fillRect(bx+6,by-9,w,1); txt(nm,bx+10,by-7,NAME_COL[spk]||'#fc4'); }
  const maxc=Math.floor((bw-(tx-bx)-8)/6);
  const full=wrapText(d.line.t,maxc);
  let left=d.chars;
  const col = spk==='NARRATOR' ? '#e8dcc0' : '#fff';
  for (let i=0;i<full.length && left>0;i++){
    const s=full[i].slice(0,left); left-=full[i].length+1;
    txt(s, tx, by+8+i*10, col);
  }
  if (d.chars>=normText(d.line.t).length && Math.floor(game.time*3)%2===0) txt('▼', bx+bw-12, by+bh-10, '#fc4');
}

function openMenu(type, data={}){ game.menu={type, idx:0, tab:0, ...data}; sfx('select'); }
function closeMenu(){ const m=game.menu; game.menu=null; sfx('cursor'); return m; }
function openShop(which){ openMenu('shop',{which}); }
function shopOwned(id){ return (id==='lantern'&&has('lantern'))||(id==='iron_sword'&&has('iron_sword'))||(id==='heartc'&&F('boughtHeart')); }
function updateMenu(){
  const m=game.menu; if (!m) return;
  if (m.type==='pause'){
    const opts=pauseOpts();
    if (pressed.up){ m.idx=(m.idx-1+opts.length)%opts.length; sfx('cursor'); }
    if (pressed.down){ m.idx=(m.idx+1)%opts.length; sfx('cursor'); }
    if (pressed.back||pressed.pause){ closeMenu(); return; }
    if (pressed.attack||pressed.confirm||pressed.jump){ opts[m.idx].go(); }
  } else if (m.type==='journal'){
    if (pressed.left||pressed.right){ m.tab=1-m.tab; m.idx=0; sfx('cursor'); }
    if (m.tab===1){ const n=Math.max(1,game.s.pages.length); if (pressed.up) m.idx=(m.idx-1+n)%n; if (pressed.down) m.idx=(m.idx+1)%n; }
    if (pressed.back||pressed.pause||pressed.inv||pressed.attack) closeMenu();
  } else if (m.type==='shop'){
    const items=SHOPS[m.which].items;
    if (pressed.up){ m.idx=(m.idx-1+items.length)%items.length; sfx('cursor'); }
    if (pressed.down){ m.idx=(m.idx+1)%items.length; sfx('cursor'); }
    if (pressed.attack||pressed.confirm||pressed.jump){
      const it=items[m.idx], s=game.s;
      if (shopOwned(it.id)){ sfx('nope'); showMsg('Already owned.'); }
      else if (s.gold<it.price){ sfx('nope'); showMsg('Not enough gold.'); }
      else {
        s.gold-=it.price; sfx('buy');

function startLevel(idx, mode='spawn'){ loadLevel(idx, mode); game.scene='play'; saveGame(); }
function loadLevel(idx, mode='spawn'){
  const fresh = !game.L || game.L.idx!==idx;
  if (fresh) game.L=buildLevel(idx);
  const L=game.L, def=L.def;
  L.crumbles.clear();
  game.s.level=idx;
  game.ents=[]; game.projs=[]; game.parts=[]; game.texts=[];
  game.boss=null; game.lock=null; game.voidOn=false; game.voidStopped=false; game.voidY=null;
  game.abedFx=0; game.troyGhost=null; game.troyPunch=0; game.dialog=null; game.menu=null; game.nearest=null;
  let spawn={x:40,y:40};
  for (const sp of L.spawns){
    if (sp.mk.type==='spawn'){ spawn={x:sp.tx*TS+3, y:(sp.ty+1)*TS-14}; continue; }
    if (sp.mk.spawnIf && !sp.mk.spawnIf()) continue;
    const e=makeEntity(sp); if (!e) continue;
    if (e.def.persist && isTaken(e)) continue;
    game.ents.push(e);
  }
  game.solids=game.ents.filter(e=>e.solid||e.platform);
  L.spawnPt=spawn;
  const cp=game.s.cp;
  const pos = (mode==='cp' && cp && cp.level===idx) ? {x:cp.x,y:cp.y} : spawn;
  game.player=makePlayer(pos.x,pos.y);
  snapCamera();
  playTrack(def.music);
  if (fresh){ game.banner=def.name; game.bannerSub=def.sub||''; game.bannerT=3.2; }
  if (def.onLoad) def.onLoad(mode, fresh);
  if (!F('entered_'+idx)){ setF('entered_'+idx); if (def.enter) setTimeout(()=>{ if (game.L===L && !game.dialog) def.enter(); }, 700); }
}
function goLevel(to){
  fadeTo(()=>{ game.s.cp=null; loadLevel(to,'spawn'); game.scene='play'; saveGame(); });
}
function respawn(noDeath=false){
  if (!noDeath || (game.player && game.player.dead)) game.s.deaths++;
  if (game.player && game.player.dead || !noDeath) game.s.hp=game.s.maxhp;
  if (game.s.hp<=0) game.s.hp=game.s.maxhp;
  loadLevel(game.s.level,'cp');
  game.player.invuln=1;
  saveGame();
}
function fadeTo(cb){ if (game.fade.dir===1) return; game.fade.dir=1; game.fade.cb=cb; }
function updateFade(dt){
  const f=game.fade;
  if (f.dir===1){ f.a=Math.min(1,f.a+dt*3.2); if (f.a>=1){ const cb=f.cb; f.cb=null; f.dir=-1; if (cb) cb(); } }
  else if (f.dir===-1){ f.a=Math.max(0,f.a-dt*2.4); if (f.a<=0) f.dir=0; }
}

// ============================================================================
// CAMERA
// ============================================================================
function camTarget(){
  const p=game.player, L=game.L;
  const tx=p.x+p.w/2-W/2+game.cam.look, ty=p.y+p.h/2-H/2-10;
  let minX=0, maxX=L.pxW-W;
  if (game.lock){ minX=Math.max(0,game.lock.x0-8); maxX=Math.min(L.pxW-W,game.lock.x1+8-W); if (maxX<minX) maxX=minX; }
  return {x:clamp(tx,minX,Math.max(minX,maxX)), y:clamp(ty,0,Math.max(0,L.pxH-H))};
}
function updateCamera(dt){
  const p=game.player; if (!p) return;
  const look=p.facing*24; game.cam.look+=(look-game.cam.look)*Math.min(1,dt*2);
  const t=camTarget();
  game.cam.x+=(t.x-game.cam.x)*Math.min(1,dt*7);
  game.cam.y+=(t.y-game.cam.y)*Math.min(1,dt*(game.voidOn?9:5));
}
function snapCamera(){ game.cam.look=0; const t=camTarget(); game.cam.x=t.x; game.cam.y=t.y; }

// ============================================================================
// UPDATE
// ============================================================================
function findNearest(){
  const p=game.player; if (!p||p.dead) return null;
  const box={x:p.x-12,y:p.y-6,w:p.w+24,h:p.h+10};
  let best=null, bd=1e9;
  for (const e of game.ents){
    if (e.dead||!e.def.interactable||!e.def.interactable(e)||!boxOverlap(box,e)) continue;
    const d=Math.abs((e.x+e.w/2)-(p.x+p.w/2));
    if (d<bd){ bd=d; best=e; }
  }
  return best;
}
function interact(e){ if (e.def.interact) e.def.interact(e); }
function updateParts(dt){
  for (const q of game.parts){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=q.g*dt; q.life-=dt; }
  game.parts=game.parts.filter(q=>q.life>0);
  for (const t of game.texts) t.t-=dt;
  game.texts=game.texts.filter(t=>t.t>0);
}
function stepPlay(dt){
  game.s.time+=dt;
  updateParts(dt);
  if (game.dialog){ updateDialog(dt); for (const e of game.ents) if (e.cine && !e.dead) e.def.update(e,dt); updateCamera(dt); return; }
  if (game.menu){ updateMenu(); return; }
  for (const e of game.ents) if (!e.dead && e.type==='lift') e.def.update(e,dt);
  updatePlayer(dt);
  const p=game.player;
  if (game.dialog||game.menu){ updateCamera(dt); return; }
  if (game.lock && p) p.x=clamp(p.x,game.lock.x0,game.lock.x1-p.w);
  updateCrumbles(dt);
  const ccx=game.cam.x+W/2, ccy=game.cam.y+H/2;
  for (const e of game.ents){
    if (e.dead||e.type==='lift') continue;
    if (e.flash>0) e.flash-=dt;
    if (!e.def.update) continue;
    if (e.enemy && (Math.abs(e.x-ccx)>W*0.9 || Math.abs(e.y-ccy)>H*0.9)) continue;
    e.def.update(e,dt);
  }
  if (p && !p.dead && p.hazT<=0){
    for (const e of game.ents){
      if (e.dead||!e.def.touch||!boxOverlap(p,e)) continue;
      e.def.touch(e);
      if (game.dialog||game.menu) break;
    }
  }
  updateBoss(dt);
  updateProjs(dt);
  updateVoid(dt);
  game.nearest=findNearest();
  if (game.ents.some(e=>e.dead)){ game.ents=game.ents.filter(e=>!e.dead); game.solids=game.ents.filter(e=>e.solid||e.platform); }
  updateCamera(dt);
}
function step(dt){
  game.time+=dt;
  if (game.hitStop>0){ game.hitStop-=dt; updateFade(dt); return; }
  if (game.scene==='title') updateTitle(dt);
  else if (game.scene==='prologue'){ if (game.dialog) updateDialog(dt); }
  else if (game.scene==='play') stepPlay(dt);
  else if (game.scene==='ending') updateEnding(dt);
  else if (game.scene==='credits') updateCredits(dt);
  if (game.msgT>0) game.msgT-=dt;
  if (game.toastT>0 && !game.dialog && game.bannerT<=0) game.toastT-=dt;
  if (game.bannerT>0 && !game.dialog) game.bannerT-=dt;
  if (game.abedFx>0) game.abedFx-=dt;
  if (game.troyPunch>0) game.troyPunch-=dt;
  if (game.troyGhost){ game.troyGhost.t-=dt; if (game.troyGhost.t<=0) game.troyGhost=null; }
  game.shake=Math.max(0,game.shake-dt*30);
  updateFade(dt);
}

// ============================================================================
// RENDER + MAIN LOOP
// ============================================================================
function render(dt){
  ctx.save();
  if (game.shake>0.5 && game.scene==='play'){ const s=game.shake*0.5; ctx.translate(Math.round(rnd(-s,s)),Math.round(rnd(-s,s))); }
  if (game.scene==='title') drawTitle();
  else if (game.scene==='prologue'){ drawPrologue(); drawDialog(); }
  else if (game.scene==='play' && game.L){ drawPlayScene(dt); drawDialog(); drawMenu(); }
  else if (game.scene==='ending') drawEnding();
  else if (game.scene==='credits') drawCredits();
  else { ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); }
  ctx.restore();
  if (game.fade.a>0){ ctx.fillStyle=`rgba(0,0,0,${game.fade.a})`; ctx.fillRect(0,0,W,H); }
  drawPostFX();
  if (game.debug && game.scene==='play' && game.player){
    const p=game.player; txt(`L${game.L.idx} x${(p.x/TS).toFixed(1)} y${(p.y/TS).toFixed(1)} ${game.god?'GOD':''}`,4,H-9,'#0f0');
  }
}
let acc=0, lastT=performance.now();
function frame(now){
  let dt=(now-lastT)/1000; lastT=now; if (dt>0.1) dt=0.1;
  pollPad(); syncHeld();
  acc+=dt;
  let n=0;
  while (acc>=DT && n<5){ acc-=DT; step(DT); clearPressed(); n++; }
  if (n>=5) acc=0;
  render(dt);
  requestAnimationFrame(frame);
}

// debug: ?debug in the URL → 1-5 warp, G god mode, B boots, T troy, L lantern, C crystal, U towelettes, $ gold
window.addEventListener('keydown', e=>{
  if (!game.debug) return;
  if (e.key>='1' && e.key<='5'){ const i=+e.key-1; give('lantern'); if (i>=2){ give('boots'); give('crystal'); } game.s.cp=null; startLevel(i); }
  const k=e.key.toLowerCase();
  if (k==='g') game.god=!game.god;
  if (k==='b') give('boots');
  if (k==='t') setF('troy');
  if (k==='l') give('lantern');
  if (k==='c') give('crystal');
  if (k==='u') game.s.towelettes+=3;
  if (e.key==='$') game.s.gold+=50;
});
window.HAWK = { game, LEVELS, loadLevel, startLevel, buildLevel, say, newGame, TILEDEF };
playTrack('title');
requestAnimationFrame(frame);
</script>
