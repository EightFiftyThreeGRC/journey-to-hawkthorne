<script>
"use strict";

window.addEventListener('error', (e)=>{
  try {
    const c=document.getElementById('game'), x=c.getContext('2d');
    x.fillStyle='#000'; x.fillRect(0,0,320,240);
    x.fillStyle='#f44'; x.font='10px monospace'; x.textBaseline='top';
    x.fillText('ERROR:', 8, 8);
    const msg=(e.message||String(e.error||'')).substring(0,400);
    let line='',y=22; for (const w of msg.split(' ')){
      if((line+' '+w).length>38){x.fillText(line,8,y);y+=12;line=w;} else line=(line+' '+w).trim();
    }
    if(line) x.fillText(line,8,y);
    if(e.lineno) x.fillText('line '+e.lineno,8,y+14);
  } catch(_){}
});

function fit(){
  const s = Math.max(1, Math.min(Math.floor(window.innerWidth/320), Math.floor((window.innerHeight-40)/240)));
  canvas.style.width=(320*s)+'px'; canvas.style.height=(240*s)+'px';
}
window.addEventListener('resize', fit); fit();

function S(legend, art){
  return { legend, rows: art.trim().split('\n').map(r=>r.replace(/^\s+/,'')) };
}
function drawSprite(spr, x, y, flip=false, tint=null, alpha=1){
  const old = ctx.globalAlpha; ctx.globalAlpha = alpha;
  for (let ry=0; ry<spr.rows.length; ry++){
    const r = spr.rows[ry];
    for (let rx=0; rx<r.length; rx++){
      const c = r[rx];
      if (c==='.'||c===' ') continue;
      const col = tint || P[spr.legend[c]] || c;
      ctx.fillStyle = col;
      const px = flip ? x+(r.length-1-rx) : x+rx;
      ctx.fillRect(px, y+ry, 1, 1);
    }
  }
  ctx.globalAlpha = old;
}

// TILES

function tilePixels(art, legend){
  const rows = art.trim().split('\n').map(r=>r.replace(/^\s+/,''));
  return (x,y,glitch=0)=>{
    for(let ry=0;ry<rows.length;ry++){
      const r=rows[ry];
      for(let rx=0;rx<r.length;rx++){
        const c=r[rx]; if(c==='.') continue;
        let col = P[legend[c]]||legend[c];
        if (glitch>0 && Math.random()<glitch*0.06){
          col=[P.glitch1,P.glitch2,P.glitch3,P.glitch4][Math.floor(Math.random()*4)];
        }
        ctx.fillStyle=col; ctx.fillRect(x+rx,y+ry,1,1);
      }
    }
  };
}

function drawTile(code,x,y,glitch=0){
  let t=null;
  if (code==='_') t=TILES.grass;
  else if (code==='#') t=TILES.dirt;
  else if (code==='=') t=TILES.platform;
  else if (code==='S') t=TILES.stone;
  else if (code==='C') t=TILES.caverock;
  else if (code==='K') t=TILES.castle;
  else if (code==='^') t=TILES.spike;
  else if (code==='T') t=TILES.tree;
  else if (code==='R') t=TILES.rubble;
  if (t) t(x,y,glitch);
}

// ============================================================================
// LEVELS
// Tile codes: ' ' sky | '_' grass(solid) | '#' dirt(solid) | '=' platform(solid)
//   'S' stone(solid) | 'C' caverock(solid) | 'K' castle(solid) | '^' spike(hazard)
//   'T' tree(decoration only) - treated as decoration, NOT solid
// Each level string has EXACTLY 16 rows. Ground row is index 13.
// ============================================================================
function mkLevel(str){
  if (str.startsWith('\n')) str=str.slice(1);
  if (str.endsWith('\n')) str=str.slice(0,-1);
  let rows = str.split('\n');
  // pad missing rows at the TOP (sky) so the ground stays anchored at the bottom
  while (rows.length<16) rows.unshift('');
  const w = Math.max(...rows.map(r=>r.length));
  return rows.map(r=>{ while(r.length<w) r=r+' '; return r; });
}

let audioCtx=null, masterGain=null, muted=false, currentTrack=null, trackTimer=null;
function initAudio(){
  if (audioCtx){ try{audioCtx.resume();}catch(_){} return; }
  try {
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain(); masterGain.gain.value=0.16;
    masterGain.connect(audioCtx.destination);
  } catch(_){ audioCtx=null; }
}
function note(f,d=0.12,t='square',v=0.5){
  if (muted||!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=t; o.frequency.value=f;
  g.gain.setValueAtTime(0,audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(v,audioCtx.currentTime+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+d);
  o.connect(g); g.connect(masterGain);
  o.start(); o.stop(audioCtx.currentTime+d+0.02);
}
function noise(d=0.1,v=0.3){
  if (muted||!audioCtx) return;
  const len=Math.floor(audioCtx.sampleRate*d);
  const b=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const a=b.getChannelData(0);
  for(let i=0;i<len;i++) a[i]=(Math.random()*2-1)*(1-i/len);
  const s=audioCtx.createBufferSource(); s.buffer=b;
  const g=audioCtx.createGain(); g.gain.value=v;
  s.connect(g); g.connect(masterGain); s.start();
}
const NOTE={'C3':130.81,'D3':146.83,'E3':164.81,'F3':174.61,'G3':196,'A3':220,'B3':246.94,
  'C4':261.63,'D4':293.66,'E4':329.63,'F4':349.23,'G4':392,'A4':440,'B4':493.88,
  'C5':523.25,'D5':587.33,'E5':659.25,'F5':698.46,'G5':783.99,'A5':880,'B5':987.77,'C6':1046.5,'_':0};
const TRACKS={
  village:{tempo:0.17,melody:['C4','E4','G4','C5','G4','E4','G4','C5','D4','F4','A4','D5','A4','F4','A4','D5','E4','G4','B4','E5','B4','G4','E4','C4']},
  cave:{tempo:0.22,melody:['A3','_','C4','A3','_','E3','A3','_','G3','E3','_','C4','D4','_','A3','_']},
  road:{tempo:0.17,melody:['D4','F4','A4','D5','C5','A4','F4','D4','G4','B4','D5','G5','F5','D5','B4','G4']},
  castle:{tempo:0.16,melody:['C4','C4','E4','G4','C5','B4','G4','E4','A4','A4','C5','E5','D5','B4','G4','E4']},
  boss:{tempo:0.11,melody:['C3','C3','D3','E3','C3','E3','D3','C3','F3','F3','G3','A3','F3','A3','G3','F3','C4','C4','B3','A3','G3','F3','E3','D3']},
  win:{tempo:0.20,melody:['C5','E5','G5','C6','G5','C6','E6','C6']},
};
function playTrack(name){
  if (currentTrack===name) return;
  currentTrack=name;
  if (trackTimer){ clearInterval(trackTimer); trackTimer=null; }
  if (!TRACKS[name]||!audioCtx) return;
  const t=TRACKS[name]; let i=0;
  trackTimer=setInterval(()=>{
    if (currentTrack!==name){ clearInterval(trackTimer); trackTimer=null; return; }
    const n=t.melody[i%t.melody.length];
    if (n!=='_') note(NOTE[n],t.tempo*0.9,'square',0.28);
    if (i%2===0){ const bn=t.melody[(i*2)%t.melody.length]; if(bn!=='_') note(NOTE[bn]/2,t.tempo*0.9,'triangle',0.2); }
    i++;
  }, t.tempo*1000);
}
function sfx(name){
  if (muted||!audioCtx) return;
  switch(name){
    case 'jump': note(440,0.08,'square',0.3); setTimeout(()=>note(660,0.06,'square',0.3),60); break;
    case 'land': noise(0.04,0.15); break;
    case 'attack': note(880,0.04,'square',0.3); setTimeout(()=>note(620,0.04,'square',0.3),40); break;
    case 'hit': noise(0.1,0.4); note(220,0.06,'sawtooth',0.3); break;
    case 'enemy_die': note(440,0.06); setTimeout(()=>note(330,0.06),60); setTimeout(()=>note(220,0.14,'sawtooth',0.3),120); break;
    case 'coin': note(990,0.04); setTimeout(()=>note(1320,0.08),40); break;
    case 'item': note(660,0.06); setTimeout(()=>note(880,0.06),60); setTimeout(()=>note(1180,0.14),120); break;
    case 'crystal': for(let i=0;i<5;i++) setTimeout(()=>note(660+i*180,0.12,'square',0.3),i*90); break;
    case 'heal': note(523,0.08); setTimeout(()=>note(784,0.12),90); break;
    case 'damage': noise(0.18,0.5); note(150,0.12,'sawtooth',0.4); break;
    case 'death': note(440,0.1); setTimeout(()=>note(330,0.1),100); setTimeout(()=>note(220,0.3,'sawtooth',0.4),200); break;
    case 'select': note(680,0.05); setTimeout(()=>note(900,0.05),45); break;
    case 'cursor': note(760,0.04,'square',0.25); break;
    case 'buy': note(880,0.05); setTimeout(()=>note(1100,0.05),50); setTimeout(()=>note(1320,0.1),100); break;
    case 'nope': note(200,0.12,'sawtooth',0.3); break;
    case 'win': for(let i=0;i<6;i++) setTimeout(()=>note([523,659,784,1046,784,1046][i],0.12),i*110); break;
    case 'gate': noise(0.4,0.3); note(110,0.4,'sawtooth',0.3); break;
  }
}

const keys={}, pressed={};
window.addEventListener('keydown', e=>{
  if (!keys[e.key]) pressed[e.key]=true;
  keys[e.key]=true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter','z','Z','x','X'].includes(e.key)) e.preventDefault();

});

const GRAV=650, MOVE_SPEED=150, JUMP_VEL=-360, MAX_FALL=440;

function makePlayer(x,y){
  return { x,y, w:12,h:14, vx:0,vy:0, onGround:false, facing:1,
           attackTime:0, invuln:0, walkAnim:0,
           coyote:0, jumpBuf:0, trail:[] };
}
function getLevel(){ return LEVELS[game.level]; }
function tileAt(map,tx,ty){
  if (ty<0||ty>=map.length) return ' ';
  const r=map[ty];
  if (tx<0||tx>=r.length) return '#';
  return r[tx];
}
function isSolid(c){ return !!SOLID[c]; }
function isHazard(c){ return !!HAZARD[c]; }

function movePlayer(p,dx,dy){
  const map=getLevel().tiles;
  if (dx!==0){
    p.x+=dx;
    const x0=Math.floor(p.x/TS), x1=Math.floor((p.x+p.w-1)/TS);
    const y0=Math.floor(p.y/TS), y1=Math.floor((p.y+p.h-1)/TS);
    if (dx>0){
      for(let ty=y0;ty<=y1;ty++) if(isSolid(tileAt(map,x1,ty))){ p.x=x1*TS-p.w; p.vx=0; break; }
    } else {
      for(let ty=y0;ty<=y1;ty++) if(isSolid(tileAt(map,x0,ty))){ p.x=(x0+1)*TS; p.vx=0; break; }
    }
  }
  if (dy!==0){
    p.y+=dy;
    const x0=Math.floor(p.x/TS), x1=Math.floor((p.x+p.w-1)/TS);
    const y0=Math.floor(p.y/TS);
    const y1=Math.floor((p.y+p.h)/TS);
    if (dy>0){
      for(let tx=x0;tx<=x1;tx++) if(isSolid(tileAt(map,tx,y1))){ p.y=y1*TS-p.h; p.vy=0; p.onGround=true; break; }
    } else {
      for(let tx=x0;tx<=x1;tx++) if(isSolid(tileAt(map,tx,y0))){ p.y=(y0+1)*TS; p.vy=0; break; }
    }
  }
  // continuous ground check
  {
    const x0=Math.floor(p.x/TS), x1=Math.floor((p.x+p.w-1)/TS);
    const by=Math.floor((p.y+p.h)/TS);
    let standing=false;
    for(let tx=x0;tx<=x1;tx++) if(isSolid(tileAt(map,tx,by))){ standing=true; break; }
    p.onGround=standing;
    if (standing && p.vy>=0) p.vy=0;
  }
  // hazard
  const cx=Math.floor((p.x+p.w/2)/TS);
  const cy=Math.floor((p.y+p.h-2)/TS);
  if (isHazard(tileAt(map,cx,cy))){ if(p.invuln<=0) damagePlayer(2); }
}

function damagePlayer(amt){
  const p=game.player;
  if (!p||p.invuln>0) return;
  game.hp-=amt;
  p.invuln=1.3;
  p.vy=-200; p.vx=-p.facing*90;
  sfx('damage'); game.shake=8;
  if (game.hp<=0){
    game.hp=0; sfx('death'); game.lives--;
    setTimeout(()=>{
      if (game.lives>0) respawnLevel();
      else { game.scene='death'; playTrack(null); }
    }, 800);
  }
}
function respawnLevel(){
  game.hp=game.maxhp;
  loadLevel(game.level);
}

function updatePlayer(dt){
  const p=game.player;
  if (!p) return;
  let move=0;
  if (isLeft()) move=-1;
  if (isRight()) move=1;
  if (move!==0) p.facing=move;
  p.vx=move*MOVE_SPEED;

  // coyote time + jump buffering — makes platforming feel responsive
  if (p.onGround) p.coyote=0.10; else p.coyote=Math.max(0,p.coyote-dt);
  if (jumpPressed()) p.jumpBuf=0.12; else p.jumpBuf=Math.max(0,p.jumpBuf-dt);
  if (p.jumpBuf>0 && p.coyote>0){
    p.vy=JUMP_VEL; p.onGround=false; p.coyote=0; p.jumpBuf=0; sfx('jump');
  }
  if (!isJump() && p.vy<-200) p.vy=-200;

  // attack OR talk
  if (attackPressed()){
    if (game.nearNpc){
      talkToNpc(game.nearNpc);
      consumePresses();
      return;
    } else if (p.attackTime<=0){
      p.attackTime=0.26; sfx('attack');
    }
  }
  if (p.attackTime>0) p.attackTime-=dt;

  // summon Abed
  if (abedKeyPressed()){
    if (game.abedScrolls>0){ game.abedScrolls--; abedSummon(); }
    else showMsg("No Abed's Scrolls. Buy one from Britta or the Merchant.");
  }
  if (game.abedFx>0) game.abedFx-=dt;
  // drink potion
  if (potionPressed() && game.potions>0 && game.hp<game.maxhp){
    game.potions--;
    game.hp=Math.min(game.maxhp, game.hp+4);
    sfx('heal');
    spawnParticles(p.x+6,p.y+6,P.red,8);
    showMsg('Drank a potion. +4 HP');
  }
  // open inventory
  if (invPressed()){ game.scene='inventory'; consumePresses(); return; }

  p.vy+=GRAV*dt;
  if (p.vy>MAX_FALL) p.vy=MAX_FALL;
  const wasGround=p.onGround;
  movePlayer(p,p.vx*dt,0);
  movePlayer(p,0,p.vy*dt);
  if (!wasGround && p.onGround) sfx('land');

  // a closed gate physically blocks passage until opened with the crystal
  for (const ge of game.entities){
    if (ge.dead) continue;
    if (ge.type==='gate' && !ge.opened){
      if (rectOverlap(p.x,p.y,p.w,p.h, ge.x,ge.y,ge.w,ge.h)){
        if (p.x < ge.x) p.x = ge.x - p.w; else p.x = ge.x + ge.w;
        p.vx = 0;
      }
    }
    // rubble: a full-height wall; only Troy can break it
    else if (ge.type==='rubble'){
      if (rectOverlap(p.x,p.y,p.w,p.h, ge.x,ge.y,ge.w,ge.h)){
        if (game.hasTroy && ge.crucial){
          // the crucial wall — Troy's sacrifice
          if (p.x < ge.x) p.x = ge.x - p.w; else p.x = ge.x + ge.w;
          p.vx = 0;
          if (!ge.triggered){
            ge.triggered = true;
            startDialog('troy_sacrifice', ()=>{
              ge.dead = true;
              game.hasTroy = false;
              game.troySacrificed = true;
              game.shake = 14;
              for (let s=0;s<7;s++)
                spawnParticles(ge.x+8, ge.y+24+s*24, s%2?P.stonedk:P.stone, 7);
            });
          }
        } else if (game.hasTroy){
          ge.dead=true; sfx('hit'); game.shake=8;
          for (let s=0;s<7;s++)
            spawnParticles(ge.x+8, ge.y+24+s*24, s%2?P.stonedk:P.stone, 6);
          showMsg('Troy smashes through the rubble wall!');
        } else {
          if (p.x < ge.x) p.x = ge.x - p.w; else p.x = ge.x + ge.w;
          p.vx = 0;
        }
      }
    }
  }
  if (move!==0 && p.onGround) p.walkAnim+=dt*8;
  if (p.invuln>0) p.invuln-=dt;

  // record a position trail so Troy can follow a few steps behind
  p.trail.push({x:p.x, y:p.y, facing:p.facing, moving:move!==0});
  if (p.trail.length>20) p.trail.shift();

  // fall out of world
  if (p.y>260){
    damagePlayer(3);
    if (game.hp>0){
      const sp=getLevel().entities.find(e=>e.type==='spawn');
      if (sp){ p.x=sp.x; p.y=sp.y; p.vx=0; p.vy=0; p.invuln=1.3; }
    }
  }

  // camera
  const levelW=getLevel().tiles[0].length*TS;
  game.camX=Math.max(0, Math.min(levelW-W, p.x-W/2));

  // entity interactions
  game.nearNpc=null;
  for (const e of game.entities){
    if (e.dead) continue;
    // NPC proximity
    if (e.type==='npc' || e.type==='cave_exit' || e.type==='gate' || e.type==='sign'){
      if (rectOverlap(p.x-6,p.y-4,p.w+12,p.h+8, e.x,e.y,e.w,e.h)){
        game.nearNpc=e;
      }
    }
    if (rectOverlap(p.x,p.y,p.w,p.h, e.x,e.y,e.w,e.h)){
      touchEntity(e);
    }
  }

  // sword hits
  if (p.attackTime>0){
    const reach = game.hasIronSword?16:12;
    const swX=p.facing>0?p.x+p.w:p.x-reach;
    const swY=p.y-2;
    for (const e of game.entities){
      if (e.dead) continue;
      if (e.enemy && rectOverlap(swX,swY,reach,p.h+4, e.x,e.y,e.w,e.h)){
        hurtEnemy(e, game.hasIronSword?2:1, p.facing);
      } else if (e.type==='crate' && rectOverlap(swX,swY,reach,p.h+4, e.x,e.y,e.w,e.h)){
        smashCrate(e);
      }
    }
    if (game.bossState && !game.bossState.dead){
      const b=game.bossState;
      if (rectOverlap(swX,swY,reach,p.h+4, b.x,b.y,(b.w||28),(b.h||24))){
        if (b.flash<=0){
          b.hp-=(game.hasIronSword?2:1); b.flash=0.3; sfx('hit'); game.shake=6; game.hitStop=0.07;
          if (b.hp<=0) defeatBoss();
        }
      }
    }
  }
}

function rectOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

function hurtEnemy(e,dmg,dir){
  if (e.hitFlash>0) return;
  e.hp-=dmg; e.hitFlash=0.2; e.vx=dir*120;
  game.hitStop=0.045;
  if (e.hp<=0){
    e.dead=true; sfx('enemy_die'); game.hitStop=0.07; game.violence++;
    spawnParticles(e.x+e.w/2,e.y+e.h/2,P.lgreen,7);
  } else sfx('hit');
}
function smashCrate(e){
  e.dead=true; sfx('enemy_die'); game.hitStop=0.05; game.shake=4; game.violence++;
  spawnParticles(e.x+8,e.y+7,P.tan,9);
  spawnParticles(e.x+8,e.y+10,P.dbrown,6);
  const loot=e.loot||'coin';
  if (loot==='coins'){ game.gold+=3; sfx('coin'); showMsg('Crate smashed! +3 gold'); }
  else if (loot==='heart'){ game.hp=Math.min(game.maxhp,game.hp+2); sfx('heal'); showMsg('A heart inside! +2 HP'); }
  else if (loot==='scroll'){ game.abedScrolls++; sfx('item'); showMsg("Abed's Scroll inside!"); }
  else if (loot==='empty'){ showMsg('...empty.'); }
  else { game.gold+=1; sfx('coin'); showMsg('+1 gold'); }
}

function touchEntity(e){
  const p=game.player;
  if (e.type==='coin'){
    e.dead=true; game.gold++; sfx('coin');
    spawnParticles(e.x+8,e.y+8,P.gold,4);
    showMsg('Gold: '+game.gold);
  }
  else if (e.type==='towelette'){
    e.dead=true; game.toweletteCount++; sfx('item');
    spawnParticles(e.x+7,e.y+7,P.lblue,7);
    if (game.toweletteCount>=game.toweletteTotal)
      showMsg('All Moist Towelettes collected! The way is clear.');
    else
      showMsg('Moist Towelette  '+game.toweletteCount+'/'+game.toweletteTotal);
  }
  else if (e.type==='heart_pickup'){
    e.dead=true; game.hp=Math.min(game.maxhp,game.hp+2); sfx('heal');
    showMsg('+2 HP');
  }
  else if (e.type==='potion_pickup'){
    e.dead=true; game.potions++; sfx('item');
    showMsg('Got a Health Potion! ('+game.potions+')');
  }
  else if (e.type==='crystal_pickup'){
    if (!e.taken){
      e.taken=true; e.dead=true; game.hasCrystal=true; sfx('crystal');
      spawnParticles(e.x+8,e.y+8,P.crystal,16);
      setQuest(4,"Take the crystal north to Castle Hawkthorne.");
      startDialog('crystal_get');
    }
  }
  else if (e.type==='flag'){
    if (!e.used){
      e.used=true; sfx('win');
      const to=e.to;
      setTimeout(()=>loadLevel(to), 700);
    }
  }
  else if (e.type==='gilbert_flee'){
    if (!e.fired){
      e.fired=true; e.dead=true;
      startDialog(e.dialog||'gilbert_flee_village');
    }
  }
  else if (e.type==='chest'){
    if (!e.opened){
      e.opened=true; sfx('item'); sfx('crystal');
      spawnParticles(e.x+8,e.y+5,P.gold,18);
      const loot=e.loot||'gold';
      if (loot==='scroll'){ game.abedScrolls+=2; showMsg("Hidden chest! 2 Abed's Scrolls"); }
      else if (loot==='sword'){ game.hasIronSword=true; showMsg('Hidden chest! The Iron Sword!'); }
      else { game.gold+=15; showMsg('Hidden chest! +15 gold'); }
    }
  }
  else if (e.type==='scene_trigger'){
    if (!e.fired){
      if (e.need==='lantern' && !game.hasLantern) return;
      e.fired=true;
      if (e.scene==='troy_recruit') game.hasTroy=true;
      if (e.scene==='blacksmith_scene') game.blacksmithClosed=true;
      startDialog(e.scene);
    }
  }
  else if (e.type==='boss_trigger'){
    if (!e.fired){
      if (game.toweletteTotal>0 && game.toweletteCount<game.toweletteTotal){
        showMsg('Gather every Moist Towelette first!  '+game.toweletteCount+'/'+game.toweletteTotal);
        const pl=game.player; pl.x=e.x-pl.w-8; pl.vx=0;
        return;
      }
      e.fired=true;
      startDialog('gilbert_pre', ()=>startBoss('gilbert'));
    }
  }
  else if (e.enemy){
    // stomp
    if (p.vy>70 && p.y+p.h < e.y+e.h/2+5){
      hurtEnemy(e,2,p.facing); p.vy=-260; sfx('enemy_die');
    } else if (p.invuln<=0){
      damagePlayer(1);
    }
  }
}

// ----- NPC / interaction -----
function talkToNpc(e){
  if (e.type==='sign'){ startDialog(e.dialog); return; }
  if (e.type==='cave_exit'){
    if (e.need==='lantern' && !game.hasLantern){
      startDialog('cave_locked');
      return;
    }
    if (e.need==='crystal' && !game.hasCrystal){
      startDialog('need_crystal');
      return;
    }
    sfx('gate');
    const to=e.to;
    startDialog(null, ()=>loadLevel(to));
    setTimeout(()=>loadLevel(to), 400);
    return;
  }
  if (e.type==='gate'){
    if (game.hasCrystal){
      if (!e.opened){
        e.opened=true; sfx('gate');
        setQuest(5,"Go RIGHT through the castle to the throne room.");
        showMsg('The gate grinds open!');
        startDialog('gate_open');
      }
    } else {
      startDialog('gate_locked');
    }
    return;
  }
  if (e.type==='npc'){
    if (e.npc==='hilda'){
      if (game.hasCrystal){ startDialog('hilda_hascrystal'); }
      else if (game.hasLantern){ startDialog('hilda_haslantern'); }
      else if (game.quest>=1){ startDialog('hilda_remind'); }
      else {
        startDialog('hilda_intro');
        setQuest(1,"Buy a lantern from the Blacksmith, then enter the Black Caverns.");
      }
    }
    else if (e.npc==='blacksmith'){
      const intro = game.hasCrystal ? 'blacksmith_done' : (game.hasLantern ? 'blacksmith_intro' : 'blacksmith_nolantern');
      startDialog(intro, ()=>openShop('blacksmith'));
    }
    else if (e.npc==='pierce'){
      if (!e.gave){
        e.gave=true; game.gold+=6;
        startDialog('pierce_intro');
      } else startDialog('pierce_after');
    }
    else if (e.npc==='troy'){
      if (!game.hasTroy){
        game.hasTroy=true;
        startDialog('troy_recruit');
      } else startDialog('troy_after');
    }
    else if (e.npc==='elder'){
      startDialog(game.elderDone ? 'elder_done' : 'elder_ask');
    }
    else if (e.npc==='britta'){
      if (!e.met){
        e.met=true;
        if (game.violence===0){
          game.abedScrolls++;
          startDialog('britta_pacifist', ()=>openShop('britta'));
        } else {
          startDialog('britta_objects', ()=>openShop('britta'));
        }
      } else openShop('britta');
    }
    else if (e.npc==='merchant'){
      startDialog('merchant_intro', ()=>openShop('merchant'));
    }
    else if (e.npc==='guardian'){
      startDialog(game.guardianStage>=2 ? 'guardian_done' : 'guardian_ask');
    }
    else if (e.npc==='villager'){
      startDialog('villager1');
    }
    else if (e.npc==='annie'){
      startDialog('annie_idle');
    }
    else if (e.npc==='shirley'){
      startDialog('shirley_idle');
    }
    else if (e.npc==='gilbert'){
      startDialog(e.dialog);
    }
  }
}
function openShop(which){
  game.shop.which=which; game.shop.idx=0; game.scene='shop';
}

// ENEMIES & ENTITIES

function makeEntity(def){
  const e={...def, dead:false, hitFlash:0};
  if (def.type==='bat'){ e.w=14;e.h=8;e.enemy=true;e.hp=2;e.vx=0;e.vy=0;e.baseY=def.y;e.t=Math.random()*6; }
  else if (def.type==='slime'){ e.w=12;e.h=12;e.enemy=true;e.hp=2;e.vx=30;e.vy=0;e.bt=0; }
  else if (def.type==='goblin'){ e.w=12;e.h=14;e.enemy=true;e.hp=3;e.vx=-44;e.vy=0; }
  else if (def.type==='knight'){ e.w=13;e.h=15;e.enemy=true;e.hp=4;e.vx=40;e.vy=0; }
  else if (def.type==='coin'){ e.w=12;e.h=12;e.anim=Math.random()*2; }
  else if (def.type==='heart_pickup'){ e.w=14;e.h=14; }
  else if (def.type==='potion_pickup'){ e.w=14;e.h=14; }
  else if (def.type==='crystal_pickup'){ e.w=14;e.h=14;e.anim=0; }
  else if (def.type==='flag'){ e.w=14;e.h=32; }
  else if (def.type==='sign'){ e.w=14;e.h=16; }
  else if (def.type==='building'){ e.w=16;e.h=16; }
  else if (def.type==='cave_exit'){ e.w=16;e.h=32; }
  else if (def.type==='gate'){ e.w=16;e.h=176;e.opened=false; }
  else if (def.type==='throne'){ e.w=16;e.h=24; }
  else if (def.type==='npc'){ e.w=14;e.h=16; }
  else if (def.type==='rubble'){ e.w=16;e.h=176; if(def.crucial&&game.troySacrificed) e.dead=true; }
  else if (def.type==='crate'){ e.w=16;e.h=16; }
  else if (def.type==='chest'){ e.w=16;e.h=14; }
  else if (def.type==='towelette'){ e.w=14;e.h=14;e.anim=Math.random()*2; }
  else if (def.type==='gilbert_flee'){ e.w=14;e.h=16;e.t=0; }
  else if (def.type==='scene_trigger'){ e.w=24;e.h=68; }
  else if (def.type==='boss_trigger'){ e.w=22;e.h=128; }
  else { e.w=12;e.h=14; }
  return e;
}

function updateEntities(dt){
  const map=getLevel().tiles;
  for (const e of game.entities){
    if (e.dead) continue;
    if (e.type==='bat'){
      e.t+=dt;
      const p=game.player;
      // drift toward player slowly + bob
      const tx=p.x, ty=p.y;
      e.x+=Math.sign(tx-e.x)*22*dt;
      e.y=e.baseY+Math.sin(e.t*3)*22;
    }
    else if (e.type==='slime'){
      e.bt+=dt;
      if (e.onGround && e.bt>0.7){ e.vy=-170; e.vx=(e.vx>=0?1:-1)*46; e.bt=0; }
      e.vy+=GRAV*dt;
      moveEnt(e,e.vx*dt,0); moveEnt(e,0,e.vy*dt);
      edgeTurn(e,map);
    }
    else if (e.type==='goblin'||e.type==='knight'){
      e.vy+=GRAV*dt;
      moveEnt(e,e.vx*dt,0); moveEnt(e,0,e.vy*dt);
      edgeTurn(e,map);
    }
    else if (e.type==='coin'||e.type==='crystal_pickup'){
      e.anim=(e.anim||0)+dt*4;
    }
    if (e.hitFlash>0) e.hitFlash-=dt;
  }
}
function edgeTurn(e,map){
  if (!e.onGround) return;
  const ahead=Math.floor((e.x+(e.vx>0?e.w+2:-2))/TS);
  const below=Math.floor((e.y+e.h+1)/TS);
  if (!isSolid(tileAt(map,ahead,below))) e.vx=-e.vx;
}
function moveEnt(e,dx,dy){
  const map=getLevel().tiles;
  if (dx!==0){
    e.x+=dx;
    const x0=Math.floor(e.x/TS),x1=Math.floor((e.x+e.w-1)/TS);
    const y0=Math.floor(e.y/TS),y1=Math.floor((e.y+e.h-1)/TS);
    if (dx>0){ for(let ty=y0;ty<=y1;ty++) if(isSolid(tileAt(map,x1,ty))){ e.x=x1*TS-e.w; e.vx=-Math.abs(e.vx); break; } }
    else { for(let ty=y0;ty<=y1;ty++) if(isSolid(tileAt(map,x0,ty))){ e.x=(x0+1)*TS; e.vx=Math.abs(e.vx); break; } }
  }
  if (dy!==0){
    e.y+=dy;
    const x0=Math.floor(e.x/TS),x1=Math.floor((e.x+e.w-1)/TS);
    const y0=Math.floor(e.y/TS),y1=Math.floor((e.y+e.h)/TS);
    if (dy>0){ e.onGround=false; for(let tx=x0;tx<=x1;tx++) if(isSolid(tileAt(map,tx,y1))){ e.y=y1*TS-e.h; e.vy=0; e.onGround=true; break; } }
    else { for(let tx=x0;tx<=x1;tx++) if(isSolid(tileAt(map,tx,y0))){ e.y=(y0+1)*TS; e.vy=0; break; } }
  }
}

function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++) game.particles.push({
    x,y, vx:(Math.random()-0.5)*130, vy:(Math.random()-0.9)*180, color, life:0.6
  });
}
function updateParticles(dt){
  for(const p of game.particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=420*dt; p.life-=dt; }
  game.particles=game.particles.filter(p=>p.life>0);
}
function drawParticles(){
  for(const p of game.particles){
    ctx.fillStyle=p.color;
    const s=p.life>0.3?3:2;
    ctx.fillRect((p.x-game.camX)|0,p.y|0,s,s);
  }
}

// ============================================================================
// DIALOG (supports choices)
// ============================================================================
function startDialog(name, after){
  const seq = name ? DIALOG[name] : null;
  if (!seq){ if(after) after(); if(!name) return; }
  game.scene='dialog';
  game.dialog={
    active:true,
    queue: seq ? seq.map(x=>({...x})) : [],
    idx:0, charIdx:0, charTime:0,
    after: after||null,
    choosing:false, choiceIdx:0,
  };
  if (!seq) endDialog();
}
function updateDialog(dt){
  const d=game.dialog;
  if (!d.active) return;
  const cur=d.queue[d.idx];
  if (!cur){ endDialog(); return; }
  if (cur.choice){
    d.choosing=true;
    if (upPressed()){ d.choiceIdx=(d.choiceIdx-1+cur.choice.length)%cur.choice.length; sfx('cursor'); }
    if (downPressed()){ d.choiceIdx=(d.choiceIdx+1)%cur.choice.length; sfx('cursor'); }
    if (actionPressed()){
      sfx('select');
      const ch=cur.choice[d.choiceIdx];
      d.active=false; game.scene='play';
      if (ch.go) ch.go();
    }
    consumePresses();
    return;
  }
  d.charTime+=dt;
  d.charIdx=Math.min(cur.t.length, Math.floor(d.charTime*38));
  if (actionPressed()){
    sfx('cursor');
    if (d.charIdx<cur.t.length){ d.charIdx=cur.t.length; d.charTime=cur.t.length/38; }
    else { d.idx++; d.charTime=0; d.charIdx=0; if(!d.queue[d.idx]) endDialog(); }
    consumePresses();
  }
}
function endDialog(){
  const after=game.dialog.after;
  game.dialog.active=false;
  // default back to play, then let the callback override the scene
  // (it may start another dialog, a shop, the boss, the credits, etc.)
  game.scene='play';
  if (after) after();
}
function drawDialog(){
  const d=game.dialog;
  const cur=d.queue[d.idx];
  if (!cur) return;
  const bx=8,by=158,bw=W-16,bh=74;
  ctx.fillStyle='#000e'; ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle='#fc4';
  ctx.fillRect(bx,by,bw,1); ctx.fillRect(bx,by+bh-1,bw,1);
  ctx.fillRect(bx,by,1,bh); ctx.fillRect(bx+bw-1,by,1,bh);
  if (cur.choice){
    txt('Choose:', bx+8, by+8, '#fc4');
    for (let i=0;i<cur.choice.length;i++){
      const sel=i===d.choiceIdx;
      txt((sel?'> ':'  ')+cur.choice[i].label, bx+12, by+24+i*14, sel?'#fc4':'#fff');
    }
    return;
  }
  txt(cur.s, bx+8, by+7, '#fc4');
  const lines=wrap(cur.t.substr(0,d.charIdx),38);
  for (let i=0;i<lines.length;i++) txt(lines[i], bx+8, by+21+i*11, '#fff');
  if (d.charIdx>=cur.t.length && (Date.now()/300|0)%2===0) txt('▼', bx+bw-13, by+bh-12, '#fc4');
}
function wrap(s,max){
  const out=[];
  for (const para of s.split('\n')){
    let line='';
    for (const w of para.split(' ')){
      if ((line+' '+w).trim().length>max){ if(line) out.push(line); line=w; }
      else line=(line+' '+w).trim();
    }
    if (line) out.push(line);
  }
  return out;
}

function itemOwned(id){
  return (id==='lantern'&&game.hasLantern)||(id==='iron_sword'&&game.hasIronSword);
}
function updateShop(){
  const s=game.shop;
  const items=shopItems();
  if (upPressed()){ s.idx=(s.idx-1+items.length)%items.length; sfx('cursor'); }
  if (downPressed()){ s.idx=(s.idx+1)%items.length; sfx('cursor'); }
  if (actionPressed()){
    const it=items[s.idx];
    if (itemOwned(it.id)){
      sfx('nope'); showMsg('Already owned.');
    } else if (game.gold<it.price){
      sfx('nope'); showMsg('Not enough gold.');
    } else {
      game.gold-=it.price; sfx('buy');
      if (it.id==='lantern'){
        game.hasLantern=true;
        setQuest(2,"Enter the Black Caverns (east) and find the White Crystal.");
        showMsg('Bought a Lantern!');
      } else if (it.id==='iron_sword'){
        game.hasIronSword=true; showMsg('Bought the Iron Sword!');
      } else if (it.id==='potion'){
        game.potions++; showMsg('Bought a Potion! ('+game.potions+')');
      } else if (it.id==='scroll'){
        game.abedScrolls++; showMsg("Bought Abed's Scroll! ("+game.abedScrolls+")");
      }
    }
    consumePresses();
  }
  if (cancelPressed()){ sfx('cursor'); game.scene='play'; consumePresses(); }
}

function startBoss(kind){
  if (kind==='gilbert'){
    const p=game.player;
    game.bossState={ kind:'gilbert', x:p.x+90, y:160, w:14, h:16, vx:0, vy:0, onGround:false,
      hp:10, maxhp:10, attackCD:1.3, jumpCD:2.0, facing:-1,
      projectiles:[], flash:0, dead:false };
  } else {
    game.bossState={ kind:'cornelius', x:560, y:60, w:28, h:26, vx:0,
      hp:14, maxhp:14, attackCD:1.6, projectiles:[], flash:0, dead:false };
  }
  playTrack('boss');
}
function updateBoss(dt){
  const b=game.bossState;
  if (!b||b.dead) return;
  if (b.flash>0) b.flash-=dt;
  const p=game.player;

  if (b.kind==='cornelius'){
    // floating head — unchanged behaviour
    b.y=58+Math.sin(performance.now()/600)*20;
    b.x += (p.x+70 - b.x)*0.6*dt;
    b.attackCD-=dt;
    if (b.attackCD<=0){
      b.attackCD=1.3-(b.maxhp-b.hp)*0.05;
      const a0=Math.atan2((p.y+8)-(b.y+14),(p.x+8)-(b.x+14));
      for (let i=-1;i<=1;i++){
        const a=a0+i*0.32;
        b.projectiles.push({x:b.x+14,y:b.y+14,vx:Math.cos(a)*130,vy:Math.sin(a)*130,life:4});
      }
    }
  } else {
    // Gilbert — grounded human duelist
    b.vy += GRAV*dt;
    if (b.vy>MAX_FALL) b.vy=MAX_FALL;
    b.facing = p.x < b.x ? -1 : 1;
    b.vx = b.facing*72;
    b.jumpCD -= dt;
    if (b.onGround && b.jumpCD<=0){ b.vy=-330; b.onGround=false; b.jumpCD=1.6+Math.random()*1.6; sfx('jump'); }
    moveEnt(b, b.vx*dt, 0);
    moveEnt(b, 0, b.vy*dt);
    b.attackCD -= dt;
    if (b.attackCD<=0){
      b.attackCD=1.5;
      const a0=Math.atan2((p.y+6)-(b.y+6),(p.x+6)-(b.x+6));
      b.projectiles.push({x:b.x+b.w/2,y:b.y+4,vx:Math.cos(a0)*155,vy:Math.sin(a0)*155-30,life:3.2,paper:true});
    }
    if (rectOverlap(b.x,b.y,b.w,b.h,p.x,p.y,p.w,p.h) && p.invuln<=0) damagePlayer(1);
  }

  for (const pr of b.projectiles){
    pr.x+=pr.vx*dt; pr.y+=pr.vy*dt; pr.life-=dt;
    if (pr.paper) pr.vy+=180*dt;
    if (rectOverlap(pr.x-3,pr.y-3,6,6, p.x,p.y,p.w,p.h)){ pr.life=0; damagePlayer(1); }
  }
  b.projectiles=b.projectiles.filter(pr=>pr.life>0);
}
function defeatBoss(){
  const b=game.bossState;
  b.dead=true; sfx('win'); game.shake=14;
  spawnParticles(b.x+b.w/2,b.y+b.h/2,P.dred,26);
  spawnParticles(b.x+b.w/2,b.y+b.h/2,P.yellow,18);
  playTrack(null);
  if (b.kind==='gilbert'){
    setQuest(6,"Climb to the throne room and face Cornelius.");
    setTimeout(()=>{
      startDialog('gilbert_defeated', ()=>{ game.bossState=null; loadLevel(4); });
    }, 800);
  } else {
    setQuest(7,"");
    setTimeout(()=>{
      startDialog('boss_down', ()=>startDialog('pierce_choice'));
    }, 900);
  }
}
function drawBoss(){
  const b=game.bossState;
  if (!b) return;
  if (!b.dead){
    const sx=(b.x-game.camX)|0, sy=b.y|0;
    const blink=b.flash>0 && Math.floor(b.flash*15)%2===0;
    ctx.save();
    if (b.kind==='cornelius'){

    }

    ctx.fillStyle='#000'; ctx.fillRect(bxx-1,21,barW+2,8);
    ctx.fillStyle='#400'; ctx.fillRect(bxx,22,barW,6);
    ctx.fillStyle='#e22'; ctx.fillRect(bxx,22,Math.max(0,(barW*b.hp/b.maxhp))|0,6);
    txtC(b.kind==='cornelius'?'CORNELIUS HAWTHORNE':'GILBERT LAWSON', 9, '#fc4');
  }
  for (const pr of b.projectiles){
    const px=(pr.x-game.camX)|0;
    if (pr.paper){
      ctx.fillStyle='#eee'; ctx.fillRect(px-4,pr.y-3,8,6);

    } else {

      ctx.fillStyle='#fc4'; ctx.fillRect(px-2,pr.y-2,4,4);
    }
  }
}

// ============================================================================
function abedSummon(){
  game.abedFx=1.1;
  sfx('crystal'); game.shake=10;
  let killed=0;
  for (const e of game.entities){
    if (e.dead || !e.enemy) continue;
    const sx=e.x-game.camX;
    if (sx>-32 && sx<W+32){
      e.dead=true; killed++;
      spawnParticles(e.x+e.w/2,e.y+e.h/2,P.lblue,8);
    }
  }
  if (game.bossState && !game.bossState.dead){
    const b=game.bossState;
    b.hp-=4; b.flash=0.5; game.shake=12;
    spawnParticles(b.x+(b.w||20)/2,b.y+(b.h||20)/2,P.lblue,16);
    if (b.hp<=0) defeatBoss();
  }
  for (let i=0;i<26;i++){
    spawnParticles(game.camX+Math.random()*W, 36+Math.random()*150,
      [P.lblue,P.gold,P.glitch2,P.white][i%4], 1);
  }
  showMsg(killed>0 ? ("Abed's spell clears the way! ("+killed+" foes)") : "Abed unleashes an overpowered spell!");
}
function drawAbedFx(){
  if (game.abedFx<=0) return;
  const a=game.abedFx;
  ctx.fillStyle=`rgba(120,180,255,${Math.min(0.5,a*0.5)})`;
  ctx.fillRect(0,0,W,H);
  // Abed appears, casting
  const sc=2+(1.1-a)*2;
  ctx.save();
  ctx.translate(W/2, H/2-10);
  ctx.scale(sc,sc);
  drawSprite(abed,-8,-8,false,null,Math.min(1,a*2));

  for (let i=0;i<3;i++){

    ctx.strokeStyle=`rgba(180,220,255,${a*0.6})`;
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(W/2,H/2-10,r,0,Math.PI*2); ctx.stroke();

}

function loadLevel(idx){
  game.level=idx;
  const lvl=LEVELS[idx];
  game.entities=lvl.entities.map(makeEntity);
  game.toweletteTotal=game.entities.filter(e=>e.type==='towelette').length;
  game.toweletteCount=0;
  const sp=lvl.entities.find(e=>e.type==='spawn');
  game.player=makePlayer(sp?sp.x:36, sp?sp.y:188);
  game.camX=0;
  game.particles=[];
  game.bossState=null;
  game.nearNpc=null;
  game.scene='play';
  game.fade.time=1; game.fade.dir=-1;
  if (lvl.music) playTrack(lvl.music);
  // per-level story triggers
  if (idx===0 && game.quest===0){
    setTimeout(()=>startDialog('intro'), 250);
  }
  if (idx===2 && !game.hasCrystal){
    // safety: shouldn't happen, but ensure crystal flow
  }
  if (idx===3){
    setQuest(5,"Open the gate and collect every Moist Towelette to proceed.");
  }
  if (lvl.boss){
    setQuest(7,"Defeat Cornelius Hawthorne!");
    setTimeout(()=>startDialog('throne_pre', ()=>startBoss('cornelius')), 400);
  }
}

  const camTileX=Math.floor(game.camX/TS);
  const endX=Math.min(map[0].length, camTileX+Math.ceil(W/TS)+1);
  for (let ty=0;ty<map.length;ty++){
    for (let tx=camTileX;tx<endX;tx++){
      const c=map[ty][tx];
      if (!c||c===' ') continue;
      drawTile(c, tx*TS-game.camX, ty*TS, glitch);
    }
  }
}
const NPC_SPRITES={hilda,blacksmith,villager,villager2:villager,gilbert,
  pierce,troy,abed,britta,merchant,annie,shirley,elder:villager,guardian:knight};
function drawEntities(){
  for (const e of game.entities){
    if (e.dead) continue;
    if (e.type==='npc' && e.npc==='blacksmith' && game.blacksmithClosed) continue;
    const sx=(e.x-game.camX)|0;
    if (sx<-40||sx>W+24) continue;
    const sy=e.y|0;
    const blink=e.hitFlash>0 && Math.floor(e.hitFlash*20)%2===0;
    if (e.type==='bat') drawSprite(bat,sx-1,sy-4,e.vx<0,null,blink?0.3:1);
    else if (e.type==='slime') drawSprite(slime,sx-2,sy-4,false,null,blink?0.3:1);
    else if (e.type==='goblin') drawSprite(goblin,sx-2,sy-2,e.vx>0,null,blink?0.3:1);
    else if (e.type==='knight') drawSprite(knight,sx-2,sy-1,e.vx>0,null,blink?0.3:1);
    else if (e.type==='coin') drawSprite((Math.floor(e.anim)%2===0)?coin_a:coin_b,sx-2,sy-2);
    else if (e.type==='towelette'){
      const bob=(Math.sin(performance.now()/300+e.x*0.1)*2)|0;
      ctx.fillStyle='rgba(150,200,255,0.18)'; ctx.fillRect(sx-3,sy-3+bob,20,20);
      drawSprite(towelette,sx-1,sy-1+bob);
    }
    else if (e.type==='heart_pickup') drawSprite(heart,sx-1,sy-1);
    else if (e.type==='potion_pickup') drawSprite(potion,sx-1,sy-1);
    else if (e.type==='crystal_pickup'){
      const bob=Math.sin(e.anim*2)*3;
      // glow
      ctx.fillStyle='rgba(180,230,255,0.25)';
      ctx.fillRect(sx-6,sy-6+bob,26,26);
      drawSprite(crystal,sx-1,sy-2+bob);
    }
    else if (e.type==='flag') drawSprite(flag,sx-1,sy-16);
    else if (e.type==='crate') drawSprite(crate,sx,sy);
    else if (e.type==='chest'){
      drawSprite(chest_c,sx,sy-2);
      if (e.opened){ ctx.fillStyle='#000a'; ctx.fillRect(sx+2,sy,12,5); }
    }
    else if (e.type==='gilbert_flee'){
      e.t=(e.t||0)+0.12;
      drawSprite(gilbert, sx-1, sy + (Math.sin(e.t)>0.4?-2:0), true);
      if ((Date.now()/350|0)%2===0) txt('Gilbert!', sx-8, sy-12, '#fc4');
    }
    else if (e.type==='sign') drawSprite(sign_spr,sx-1,sy);
    else if (e.type==='building'){
      ctx.save(); ctx.translate(sx,sy); ctx.scale(2,2);
      drawSprite(building,0,0);
      ctx.restore();
      if (e.smithy && game.blacksmithClosed){
        ctx.fillStyle='#641';
        ctx.fillRect(sx-3,sy+12,40,5);
        ctx.fillRect(sx-3,sy+22,40,5);
        ctx.save(); ctx.translate(sx+16,sy+19); ctx.rotate(0.42);
        ctx.fillStyle='#852'; ctx.fillRect(-26,-3,52,5); ctx.restore();
        ctx.fillStyle='#000a'; ctx.fillRect(sx+4,sy+1,26,9);
        txt('CLOSED', sx+5, sy+2, '#fda');
      }
    }
    else if (e.type==='cave_exit') drawSprite(cave_mouth,sx,sy);
    else if (e.type==='rubble'){
      for (let ry=0; ry<e.h; ry+=16) TILES.rubble(sx, sy+ry);
      const pl=game.player;
      if (pl && rectOverlap(pl.x-18,pl.y,pl.w+36,pl.h, e.x,e.y,e.w,e.h)){
        txt(game.hasTroy?'Troy smashes through!':'A wall blocks the way', sx-22, sy+74, '#fc4');
      }
    }
    else if (e.type==='gate'){
      if (!e.opened){
        ctx.fillStyle='#0b0b16'; ctx.fillRect(sx,sy,e.w,e.h);
        ctx.fillStyle='#8a929e';
        for (let bx=2; bx<e.w-1; bx+=5) ctx.fillRect(sx+bx,sy,2,e.h);
        ctx.fillStyle='#aeb6c4';
        for (let by=3; by<e.h; by+=15) ctx.fillRect(sx,sy+by,e.w,2);
        ctx.fillStyle=game.hasCrystal?'#cef':'#456';
        ctx.fillRect(sx+5,sy+e.h-46,6,7);
        const pl=game.player;
        if (pl && rectOverlap(pl.x-20,pl.y,pl.w+40,pl.h, e.x,e.y,e.w,e.h) && (Date.now()/350|0)%2===0){
          txt(game.hasCrystal?'Z: raise the White Crystal':'The gate is sealed shut', sx-40, sy+e.h-64, '#fc4');
        }
      } else {
        ctx.fillStyle='#0b0b16'; ctx.fillRect(sx,sy,e.w,e.h);
        ctx.fillStyle='#8a929e';
        for (let bx=2; bx<e.w-1; bx+=5) ctx.fillRect(sx+bx,sy,2,14);
      }
    }
    else if (e.type==='throne') drawSprite(throne,sx,sy);
    else if (e.type==='npc'){
      const spr=NPC_SPRITES[e.npc]||villager;
      drawSprite(spr,sx-1,sy);
    }
    // talk prompt
    if (e===game.nearNpc && (e.type==='npc'||e.type==='sign'||e.type==='cave_exit'||e.type==='gate')){
      if ((Date.now()/350|0)%2===0){
        txt('Z', sx+e.w/2-3, sy-12, '#fc4');
      }
    }
  }
}
function drawPlayer(){
  const p=game.player;
  if (!p) return;
  // Troy follows a few steps behind, mirroring the path you took
  if (game.hasTroy && p.trail.length>0){
    const tp=p.trail[0];
    drawSprite(troy, ((tp.x-game.camX)|0)-2, (tp.y|0)-2, tp.facing<0);
  }
  const sx=(p.x-game.camX)|0, sy=p.y|0;
  const blink=p.invuln>0 && Math.floor(p.invuln*20)%2===0;
  let spr=hero_idle;
  if (p.attackTime>0) spr=hero_attack;
  else if (!p.onGround) spr=hero_jump;
  else if (Math.abs(p.vx)>10) spr=(Math.floor(p.walkAnim)%2===0)?hero_idle:hero_walk;
  drawSprite(spr,sx-2,sy-2,p.facing<0,null,blink?0.3:1);
}
function drawDarkness(){
  if (!getLevel().dark) return;
  const p=game.player;
  const px=(p.x-game.camX+p.w/2)|0, py=(p.y+p.h/2)|0;
  const r = game.hasLantern ? 86 : 30;
  const grd=ctx.createRadialGradient(px,py,r*0.35,px,py,r);
  grd.addColorStop(0,'rgba(0,0,0,0)');
  grd.addColorStop(0.7,'rgba(0,0,0,0.45)');
  grd.addColorStop(1,'rgba(5,3,8,0.97)');
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,H);
}
function drawHUD(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,18);
  ctx.fillStyle='#fff'; ctx.fillRect(0,18,W,1);
  // hearts
  for (let i=0;i<game.maxhp/2;i++){
    const hp=game.hp-i*2;
    let col=hp>=2?'#e22':(hp>=1?'#a44':'#400');
    ctx.fillStyle=col; ctx.fillRect(6+i*11,5,9,8);
    ctx.fillStyle='#fff'; ctx.fillRect(7+i*11,6,1,1);
  }
  // gold
  drawSprite(coin_a, 74,1);
  txt('x'+game.gold, 90, 5, '#fd4');
  // potions
  drawSprite(potion, 122,0);
  txt('x'+game.potions, 136, 5, '#f88');
  // abed scrolls
  drawSprite(scroll_item, 162,1);
  txt('x'+game.abedScrolls, 176, 5, '#7af');
  // key items
  let kx=204;
  if (game.hasLantern){ drawSprite(lantern,kx,1); kx+=15; }
  if (game.hasCrystal){ drawSprite(crystal,kx,1); kx+=15; }
  if (game.hasIronSword){ drawSprite(sword_item,kx,1); kx+=15; }
  if (game.hasTroy){ txt('TROY', kx,5,'#e22'); kx+=30; }
  // lives
  txt('Lv'+game.lives, 290, 5, '#fff');
  // objective ticker (below HUD)
  if (game.questText){
    ctx.fillStyle='#000a'; ctx.fillRect(0,19,W,11);
    txt('⚑ '+game.questText, 4, 21, '#fc4');
  }
  // moist towelette counter (castle level)
  if (game.toweletteTotal>0){
    const done=game.toweletteCount>=game.toweletteTotal;
    const wt='WIPES '+game.toweletteCount+'/'+game.toweletteTotal;
    ctx.fillStyle='#000c'; ctx.fillRect(W-wt.length*5-10,19,wt.length*5+10,11);
    txt(wt, W-wt.length*5-6, 21, done?'#7f7':'#7cf');
  }
  // transient message
  if (game.msg && game.msgTime>0){
    const w=ctx.measureText(game.msg).width;
    ctx.fillStyle='#000c'; ctx.fillRect((W-w)/2-6,H-22,w+12,13);
    txtC(game.msg, H-20, '#fff');
  }
}

function drawPlayScene(){
  drawBackground();
  drawLevel();
  drawEntities();
  drawPlayer();
  drawBoss();
  drawParticles();
  drawDarkness();
  drawAbedFx();
  drawHUD();
}

// ============================================================================
// TITLE / DEATH / ENDING
// ============================================================================
let titlePulse=0;
function updateTitle(dt){
  titlePulse+=dt;
  if (actionPressed()){
    sfx('select'); initAudio(); consumePresses();
    // reset
    game.gold=0; game.potions=0; game.hasLantern=false; game.hasCrystal=false;
    game.hasIronSword=false; game.hasTroy=false; game.troySacrificed=false;
    game.abedScrolls=0; game.abedFx=0; game.hitStop=0;
    game.violence=0; game.blacksmithClosed=false;
    game.elderDone=false; game.guardianStage=0;
    game.quest=0; game.hp=6; game.maxhp=6; game.lives=3;
    game.questText="Explore the village. Find Hilda.";
    loadLevel(0);
  }
}
function drawTitle(){
  ctx.fillStyle='#04060c'; ctx.fillRect(0,0,W,H);
  for (let y=0;y<H;y+=TS) for (let x=0;x<W;x+=TS){
    if (((x/TS)+(y/TS))%2===0){ ctx.fillStyle='#0a0e18'; ctx.fillRect(x,y,TS,TS); }
  }
  ctx.fillStyle='#fc4';
  ctx.fillRect(8,8,W-16,2); ctx.fillRect(8,H-10,W-16,2);
  ctx.fillRect(8,8,2,H-16); ctx.fillRect(W-10,8,2,H-16);
  txtBigC('JOURNEY TO THE', 26, '#fc4');
  txtBigC('CENTER OF HAWKTHORNE', 46, '#fc4');
  ctx.save(); ctx.translate(W/2-24,72); ctx.scale(3,3);
  drawSprite(cornelius,0,0); ctx.restore();
  txtC('A platform-adventure tribute to', 152, '#aaa');
  txtC('Community S3E20 "Digital Estate Planning"', 164, '#888');
  if ((Math.floor(titlePulse*2))%2===0) txtC('▶ PRESS Z OR SPACE TO BEGIN ◀', 188, '#fc4');
  txtC('←→ move  •  SPACE jump  •  Z attack / talk', 206, '#666');
  txtC('Q potion  •  E summon Abed  •  I inventory  •  M mute', 218, '#666');
}
function updateDeath(){
  if (actionPressed()){
    sfx('select'); consumePresses();
    // full reset — start the whole game over from the village
    game.gold=0; game.potions=0; game.hasLantern=false; game.hasCrystal=false;
    game.hasIronSword=false; game.hasTroy=false; game.troySacrificed=false;
    game.abedScrolls=0; game.abedFx=0; game.hitStop=0;
    game.violence=0; game.blacksmithClosed=false;
    game.elderDone=false; game.guardianStage=0;
    game.quest=0; game.hp=6; game.maxhp=6; game.lives=3;
    game.questText="Explore the village. Find Hilda.";
    loadLevel(0);
  }
}
function drawDeath(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  txtBigC('GAME OVER',76,'#f44');
  txtC('The Hawkthorne game has beaten you.',104,'#aaa');
  txtC('All progress is lost.',118,'#888');
  if ((Date.now()/400|0)%2===0) txtC('Press Z to start over from the beginning',146,'#fc4');
}
function drawEnding(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  for (let i=0;i<46;i++){
    ctx.fillStyle='#222';
    ctx.fillRect((i*29)%W,(i*41+performance.now()/45)%H,1,1);
  }
  if (game.endingType==='good'){
    txtBigC('THE INHERITANCE',30,'#fc4');
    txtBigC('GIVEN AWAY',50,'#fc4');
    drawSprite(hero_idle,84,90); drawSprite(gilbert,120,90);
    drawSprite(hilda,156,90); drawSprite(cornelius,200,90);
    txtC('You gave the throne to Gilbert,',132,'#fff');
    txtC('the brother Cornelius hid away.',144,'#fff');
    txtC('His cruel game was beaten by family.',158,'#fff');
    txtC('"Margaritas. On me." -- Gilbert',184,'#fc4');
  } else {
    txtBigC('THE WORTHY HEIR',38,'#c44');
    drawSprite(hero_idle,150,86);
    txtC('You took the fortune for yourself.',122,'#fff');
    txtC('Cornelius would have been proud.',136,'#aaa');
    txtC('Gilbert walked out alone.',150,'#aaa');
    txtC('You won. It feels like nothing.',172,'#c88');
  }
  txtC('-- THE END --',202,'#888');
  if ((Date.now()/500|0)%2===0) txtC('Press Z for title',222,'#666');
}
function updateEnding(){ if (actionPressed()){ consumePresses(); location.reload(); } }

// ============================================================================
// CREDITS - scrolling roll
// ============================================================================
const CREDITS = [
  ['big','JOURNEY TO THE'],
  ['big','CENTER OF HAWKTHORNE'],
  ['gap',''],
  ['','a platform-adventure tribute to'],
  ['gold','COMMUNITY'],
  ['','season 3, episode 20'],
  ['','"Digital Estate Planning"'],
  ['gap',''],
  ['head','- THE PARTY -'],
  ['','JEFF      the swordsman'],
  ['','BRITTA    the potion-brewer'],
  ['','ABED      the overpowered wizard'],
  ['','TROY      the strong one'],
  ['','ANNIE     ...got into character'],
  ['','SHIRLEY   ...also got into character'],
  ['','PIERCE    the anxious heir'],
  ['gap',''],
  ['head','- AND -'],
  ['','GILBERT LAWSON    the hidden son'],
  ['','HILDA             the blacksmith’s daughter'],
  ['','CORNELIUS         the late father'],
  ['gap',''],
  ['gold','HAWTHORNE WIPES'],
  ['','"the way of the future"'],
  ['gap',''],
  ['head','- THE QUEST -'],
  ['','You found the White Crystal,'],
  ['','bested Gilbert and Cornelius,'],
  ['','and chose family over a fortune.'],
  ['gap',''],
  ['','built as one HTML file'],
  ['','8-bit sprites, chiptune & heart'],
  ['gap',''],
  ['gap',''],
  ['big','THE END'],
  ['gap',''],
  ['','press Z to return to the title'],
];
function updateCredits(dt){
  game.creditTime = (game.creditTime||0) + dt;
  game.creditY -= 24*dt;
  const totalH = CREDITS.length*16 + 120;
  if (game.creditY < -totalH) game.creditY = -totalH;
  // grace period: ignore input briefly so Z-mashing from the ending
  // dialogs doesn't instantly skip the credits
  if (game.creditTime > 3.5 && actionPressed()){ consumePresses(); location.reload(); }
}
function drawCredits(){
  ctx.fillStyle='#04060c'; ctx.fillRect(0,0,W,H);
  for (let i=0;i<50;i++){
    ctx.fillStyle='#161a26';
    ctx.fillRect((i*53)%W,(i*61)%H,1,1);
  }
  let y=game.creditY|0;
  for (const [kind,line] of CREDITS){
    if (y>-20 && y<H+20){
      if (kind==='big') txtBigC(line,y,'#fc4');
      else if (kind==='gold') txtC(line,y,'#fd4');
      else if (kind==='head') txtC(line,y,'#7af');
      else if (kind==='gap'){}
      else txtC(line,y,'#fff');
    }
    y += (kind==='big')?22:(kind==='gap'?10:14);
  }
  // little party sprite parade at the bottom edge
  const t=performance.now()/1000;
  const paradeSprites=[hero_idle,britta,abed,troy,annie,shirley,pierce,gilbert];
  for (let i=0;i<paradeSprites.length;i++){
    const px=((i*40 + t*30)%(W+40))-20;
    drawSprite(paradeSprites[i], px, H-20 + (Math.sin(t*6+i)>0.6?-2:0));
  }
  // skip hint, only after the grace period
  if ((game.creditTime||0) > 3.5 && (Date.now()/450|0)%2===0){
    ctx.fillStyle='#000b'; ctx.fillRect(0,H-12,W,12);
    txtC('press Z to return to the title screen', H-11, '#fc4');
  }
}

// ============================================================================
// FADE
// ============================================================================
function updateFade(dt){
  if (game.fade.dir>0){
    game.fade.time=Math.min(1,game.fade.time+dt*2.6);
    if (game.fade.time>=1 && game.fade.after){ const cb=game.fade.after; game.fade.after=null; cb(); }
  } else if (game.fade.dir<0){
    game.fade.time=Math.max(0,game.fade.time-dt*2.6);
    if (game.fade.time<=0) game.fade.dir=0;
  }
}
function drawFade(){
  if (game.fade.time>0){ ctx.fillStyle=`rgba(0,0,0,${game.fade.time})`; ctx.fillRect(0,0,W,H); }
}

// ============================================================================
// MAIN LOOP
// ============================================================================
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;

  if (game.hitStop>0){
    // brief freeze-frame on a solid hit, for impact
    game.hitStop-=dt;
  } else {
    if (game.scene==='title') updateTitle(dt);
    else if (game.scene==='play'){
      updatePlayer(dt);
      if (game.bossState) updateBoss(dt);
      else updateEntities(dt);
      updateParticles(dt);
    }
    else if (game.scene==='dialog'){ updateDialog(dt); updateParticles(dt); }
    else if (game.scene==='shop') updateShop();
    else if (game.scene==='inventory') updateInventory();
    else if (game.scene==='death') updateDeath();
    else if (game.scene==='ending') updateEnding();
    else if (game.scene==='credits') updateCredits(dt);
    updateFade(dt);
    if (game.msgTime>0) game.msgTime-=dt;
  }

  ctx.save();
  if (game.shake>0){
    ctx.translate((Math.random()*game.shake-game.shake/2)|0,(Math.random()*game.shake-game.shake/2)|0);
    game.shake=Math.max(0,game.shake-1);
  }
  if (game.scene==='title') drawTitle();
  else if (game.scene==='play') drawPlayScene();
  else if (game.scene==='dialog'){ drawPlayScene(); drawDialog(); }
  else if (game.scene==='shop') drawShop();
  else if (game.scene==='inventory') drawInventory();
  else if (game.scene==='death') drawDeath();
  else if (game.scene==='ending') drawEnding();
  else if (game.scene==='credits') drawCredits();
  ctx.restore();
  drawFade();
  drawPostFX();

  consumePresses();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
